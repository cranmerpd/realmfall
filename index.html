<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realmfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; --bg:#07080b; --line:rgba(255,255,255,.12); --ink:#f4f6f8; --dim:#8d95a3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100%; }
  header { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .pip { width: 7px; height: 7px; border-radius: 50%; background: #f4f7fc; box-shadow: 0 0 0 4px rgba(255,255,255,.06); }
  h1 { margin: 0; font: 600 16px/1 "Barlow Condensed", sans-serif; letter-spacing: .24em; }
  .brand p { margin: 3px 0 0; color: var(--dim); font: 500 10px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .16em; }
  .grow { flex: 1; }
  .controls { display: flex; align-items: center; gap: 8px; }
  button { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font: 500 12px/1 "Barlow Condensed", sans-serif; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  button:hover { border-color: rgba(255,255,255,.45); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; color: var(--dim); padding: 7px 11px; }
  .seg button.on { background: #f4f7fc; color: #090a0d; }
  .clock { min-width: 108px; text-align: right; }
  .clock .k, .kicker { color: var(--dim); font: 500 10px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .16em; }
  .clock strong { display: block; margin-top: 4px; font: 500 18px/1 "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .clock em { display: block; margin-top: 4px; color: var(--dim); font: 500 10px/1 "IBM Plex Mono", ui-monospace, monospace; font-style: normal; letter-spacing: .12em; }
  #wrap { flex: 1; display: flex; min-height: 0; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { width: 100%; height: 100%; display: block; background: #070b14; cursor: crosshair; }
  #tip { position: fixed; z-index: 4; display: none; pointer-events: none; padding: 6px 8px; background: rgba(8,10,14,.9); border: 1px solid rgba(255,255,255,.16); color: #f4f7fc; font: 500 12px/1 "Barlow Condensed", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  aside { width: 312px; overflow: auto; padding: 20px 18px 32px; background: #08090c; border-left: 1px solid var(--line); }
  .kicker { margin: 22px 0 8px; }
  aside h2 { margin: 0; font: 600 32px/0.95 "Barlow Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  #blurb { margin: 8px 0 0; color: var(--dim); font-size: 12.5px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .row b { color: var(--ink); font: 500 13px/1 "IBM Plex Mono", ui-monospace, monospace; font-weight: 500; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.06); cursor: pointer; font: 500 15px/1 "Barlow Condensed", sans-serif; letter-spacing: .05em; text-transform: uppercase; }
  li.on .name { color: #fff; }
  li .num { margin-left: auto; color: var(--dim); font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0; text-transform: none; }
  .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #log .ev { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.06); }
  #log span { color: var(--dim); font: 500 11px/1.4 "IBM Plex Mono", ui-monospace, monospace; }
  #log p { margin: 0; color: #d7dce4; font-size: 12.5px; }
  @media (max-width: 860px) {
    header { flex-wrap: wrap; }
    .grow { display: none; }
    #wrap { flex-direction: column; }
    aside { width: auto; max-height: 42vh; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <i class="pip"></i>
    <div>
      <h1>REALMFALL</h1>
      <p>WORLD SIMULATION</p>
    </div>
  </div>
  <div class="grow"></div>
  <div class="controls">
    <button id="newmap" type="button">New map</button>
    <button id="pause" type="button">Pause</button>
    <div class="seg" id="speed">
      <button type="button" data-s="1">1×</button>
      <button type="button" data-s="2" class="on">2×</button>
      <button type="button" data-s="4">4×</button>
      <button type="button" data-s="8">8×</button>
    </div>
  </div>
  <div class="clock">
    <span class="k">YEAR</span>
    <strong id="year">—</strong>
    <em id="count"></em>
  </div>
</header>
<div id="wrap">
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="tip"></div>
  </div>
  <aside>
    <div class="kicker">SELECTED</div>
    <h2 id="focus">The world</h2>
    <p id="blurb">Names sit on the larger realms. A white ring is a capital. Borders move when a war starts.</p>
    <div id="stats"></div>
    <div class="kicker">REALMS</div>
    <ul id="list"></ul>
    <div class="kicker">CHRONICLE</div>
    <div id="log"></div>
  </aside>
</div>
<script>
const COLS = 120, ROWS = 78;
const LAND = 1, WATER = 0;
const prefixes = ["Ash","Dun","Kor","Vel","Mar","Ost","Ryn","Hal","Tor","Brae","Quel","Sar","Ith","Nor","Caer","Wyn","Gal","Thal","Eld","Mir"];
const suffixes = ["wald","heim","dor","reach","mark","hold","ia","und","fen","gard","mere","wyn","oth","lan","bar","ric","moor","stead","vane","spire"];
const colors = ["#d4655c","#e0ae58","#4eae9c","#6d90d6","#c96b9a","#e08a45","#8fb45e","#c9a06a","#3f9178","#d46d78","#b59a48","#3e8c96","#d48462","#7d74d0","#d2c15a","#5a9a55","#c45656","#4d7eb8","#d49a74","#8a8648"];

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let grid, owner, nations, year, paused, selected, logLines, acc, seed, coast;
let nextId = 1;
let speed = 2;

function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function ri(n) { return Math.floor(rnd() * n); }
function pick(a) { return a[ri(a.length)]; }
function nameRealm() { return pick(prefixes) + pick(suffixes); }
function hypot(x, y, c) { const dx = x - c.x, dy = y - c.y; return Math.sqrt(dx * dx + dy * dy); }
function key(x, y) { return y * COLS + x; }

function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(320, r.width);
  canvas.height = Math.max(240, r.height);
}
window.addEventListener("resize", resize);

function neighbors(x, y) {
  const n = [];
  if (x > 0) n.push([x - 1, y]);
  if (x < COLS - 1) n.push([x + 1, y]);
  if (y > 0) n.push([x, y - 1]);
  if (y < ROWS - 1) n.push([x, y + 1]);
  return n;
}

function stamp(cx, cy, rx, ry) {
  const y0 = Math.max(1, Math.floor(cy - ry - 1));
  const y1 = Math.min(ROWS - 2, Math.ceil(cy + ry + 1));
  const x0 = Math.max(1, Math.floor(cx - rx - 1));
  const x1 = Math.min(COLS - 2, Math.ceil(cx + rx + 1));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const nx = (x - cx) / rx, ny = (y - cy) / ry;
      if (nx * nx + ny * ny < 1 + (rnd() - 0.5) * 0.45) grid[y][x] = LAND;
    }
  }
}

function smoothLand() {
  const next = grid.map(row => row.slice());
  for (let y = 1; y < ROWS - 1; y++) {
    for (let x = 1; x < COLS - 1; x++) {
      let c = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) c += grid[y + dy][x + dx] === LAND;
      if (c >= 6) next[y][x] = LAND;
      else if (c <= 3) next[y][x] = WATER;
    }
  }
  grid = next;
}

function generate() {
  seed = (Date.now() % 2000000000) + 1;
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(WATER));
  owner = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  stamp(28 + ri(18), 28 + ri(14), 20 + ri(6), 14 + ri(4));
  stamp(72 + ri(16), 32 + ri(14), 18 + ri(6), 13 + ri(4));
  stamp(52 + ri(16), 40 + ri(12), 14 + ri(6), 10 + ri(4));
  if (rnd() < 0.65) stamp(18 + ri(80), 14 + ri(48), 5 + ri(3), 4 + ri(2));
  for (let p = 0; p < 3; p++) smoothLand();
  nations = [];
  nextId = 1;
  year = 800 + ri(400);
  logLines = [];
  const spots = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[y][x] === LAND) spots.push([x, y]);
  const start = 5 + ri(3);
  const chosen = [];
  for (let i = 0; i < start && spots.length; i++) {
    let best = 0, bestScore = -1;
    const tries = Math.min(60, spots.length);
    for (let t = 0; t < tries; t++) {
      const j = ri(spots.length);
      const [x, y] = spots[j];
      let score = 999;
      for (const c of chosen) score = Math.min(score, Math.hypot(x - c.x, y - c.y));
      if (score > bestScore) { bestScore = score; best = j; }
    }
    const [x, y] = spots.splice(best, 1)[0];
    if (chosen.some(c => Math.hypot(x - c.x, y - c.y) < 12)) continue;
    chosen.push({ x, y });
    const n = found(x, y, nameRealm(), colors[i % colors.length]);
    claimDisk(n, 3);
  }
  selected = nations[0] ? nations[0].id : null;
  logLines = [year + ": A new age begins. The crowns are few, and the empty land is wide."];
  acc = 0;
  recount();
  markCoast();
  render();
  drawUI();
}

function found(x, y, name, color) {
  const id = nextId++;
  const n = {
    id, name, color, born: year || 1000, stability: 75 + ri(15), pops: 1,
    capital: { x, y }, label: { x, y }, atWar: new Set(), peace: {}, wars: {}, quietUntil: (year || 1000) + 80
  };
  nations.push(n);
  if (grid[y] && grid[y][x] === LAND) owner[y][x] = id;
  chronicle(year || 1000, name + " is founded.");
  return n;
}

function claimDisk(n, r) {
  const c = n.capital;
  for (let y = Math.max(0, c.y - r); y <= Math.min(ROWS - 1, c.y + r); y++) {
    for (let x = Math.max(0, c.x - r); x <= Math.min(COLS - 1, c.x + r); x++) {
      if (grid[y][x] !== LAND || owner[y][x] >= 0) continue;
      if (hypot(x, y, c) <= r) owner[y][x] = n.id;
    }
  }
}

function chronicle(y, text) {
  if (!logLines) logLines = [];
  logLines.unshift(y + ": " + text);
  logLines = logLines.slice(0, 12);
}

function byId(id) { return nations.find(n => n.id === id); }
function atPeace(n, id) { return (n.peace[id] || 0) > year; }

function makePeace(a, b, years) {
  a.atWar.delete(b.id);
  b.atWar.delete(a.id);
  delete a.wars[b.id];
  delete b.wars[a.id];
  const until = year + years;
  a.peace[b.id] = until;
  b.peace[a.id] = until;
}

function declareWar(n, foe) {
  if (!foe || n.atWar.size || foe.atWar.size || atPeace(n, foe.id)) return false;
  n.atWar.add(foe.id);
  foe.atWar.add(n.id);
  n.wars[foe.id] = year;
  foe.wars[n.id] = year;
  chronicle(year, n.name + " goes to war with " + foe.name + ".");
  return true;
}

function cellsOf(id) {
  const cells = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (owner[y][x] === id) cells.push([x, y]);
  return cells;
}

function components(cells) {
  const set = new Set(cells.map(([x, y]) => key(x, y)));
  const seen = new Set();
  const comps = [];
  for (const [x, y] of cells) {
    const k0 = key(x, y);
    if (seen.has(k0)) continue;
    const comp = [];
    const q = [[x, y]];
    seen.add(k0);
    while (q.length) {
      const [cx, cy] = q.shift();
      comp.push([cx, cy]);
      for (const [nx, ny] of neighbors(cx, cy)) {
        const k = key(nx, ny);
        if (!seen.has(k) && set.has(k)) { seen.add(k); q.push([nx, ny]); }
      }
    }
    comps.push(comp);
  }
  comps.sort((a, b) => b.length - a.length);
  return comps;
}

function recount() {
  for (const n of nations) n.pops = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const id = owner[y][x];
    if (id >= 0) { const n = byId(id); if (n) n.pops++; }
  }
  nations = nations.filter(n => n.pops > 0);
}

function step() {
  year++;
  recount();
  const claimants = nations.slice();
  for (const n of claimants) {
    if (!nations.includes(n) || n.pops === 0) continue;
    settleCapital(n);
    measure(n);
    if (n.atWar.size) warPush(n);
    else {
      grow(n);
      considerWar(n);
    }
  }
  settleWars();
  for (const n of nations.slice()) {
    if (nations.includes(n) && n.pops > 48 && n.reach > 16 && n.stability < 30 && year >= (n.quietUntil || 0) && rnd() < 0.03) rebel(n);
  }
  keepWhole();
  absorbTiny();
  if (year % 35 === 0) seedEmptyContinent();
  recount();
  for (const n of nations) settleCapital(n);
  drawUI();
}

function settleCapital(n) {
  if (n.capital && owner[n.capital.y] && owner[n.capital.y][n.capital.x] === n.id) return;
  const cells = cellsOf(n.id);
  if (!cells.length) return;
  const comps = components(cells);
  const main = comps[0];
  let best = main[0], bestD = Infinity;
  const origin = n.capital || { x: best[0], y: best[1] };
  for (const [x, y] of main) {
    const d = hypot(x, y, origin);
    if (d < bestD) { bestD = d; best = [x, y]; }
  }
  n.capital = { x: best[0], y: best[1] };
}

function measure(n) {
  const cells = cellsOf(n.id);
  n.pops = cells.length;
  if (!cells.length) { n.reach = 0; return; }
  let maxD = 0, sum = 0, sx = 0, sy = 0;
  for (const [x, y] of cells) {
    const d = hypot(x, y, n.capital);
    if (d > maxD) maxD = d;
    sum += d;
    sx += x;
    sy += y;
  }
  n.reach = maxD;
  n.label = { x: sx / cells.length, y: sy / cells.length };
  const avg = sum / cells.length;
  if (avg > 11) n.stability -= 0.12 + (avg - 11) * 0.04;
  else n.stability += 0.18;
  if (n.atWar.size) n.stability -= 0.25;
  n.stability = Math.max(4, Math.min(100, n.stability));
}

function emptyFrontier(n) {
  const moves = [];
  const seen = new Set();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (owner[y][x] !== n.id) continue;
    for (const [tx, ty] of neighbors(x, y)) {
      const k = key(tx, ty);
      if (seen.has(k) || grid[ty][tx] !== LAND || owner[ty][tx] >= 0) continue;
      seen.add(k);
      let friends = 0;
      for (const [ax, ay] of neighbors(tx, ty)) if (owner[ay][ax] === n.id) friends++;
      moves.push({ tx, ty, d: hypot(tx, ty, n.capital), friends });
    }
  }
  return moves;
}

function grow(n) {
  const moves = emptyFrontier(n).filter(m => m.d <= Math.max(4, n.reach + 2.2));
  if (!moves.length) return;
  moves.sort((a, b) => (b.friends - a.friends) || (a.d - b.d));
  const take = Math.min(moves.length, moves.length > 10 ? 2 : 1);
  for (let i = 0; i < take; i++) {
    const open = moves.filter(m => owner[m.ty][m.tx] < 0);
    if (!open.length) break;
    const bestFriends = open.reduce((m, c) => Math.max(m, c.friends), 0);
    const pool = open.filter(m => m.friends === bestFriends).sort((a, b) => a.d - b.d).slice(0, 4);
    const m = pool[ri(pool.length)];
    owner[m.ty][m.tx] = n.id;
    n.stability = Math.min(100, n.stability + 0.15);
  }
}

function borderCounts(n) {
  const counts = {};
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (owner[y][x] !== n.id) continue;
    for (const [tx, ty] of neighbors(x, y)) {
      const o = owner[ty][tx];
      if (o >= 0 && o !== n.id) counts[o] = (counts[o] || 0) + 1;
    }
  }
  return counts;
}

function considerWar(n) {
  if (n.atWar.size) return;
  const open = emptyFrontier(n).length;
  const counts = borderCounts(n);
  let foe = null, best = 0;
  for (const id of Object.keys(counts)) {
    const other = byId(Number(id));
    if (!other || other.atWar.size || atPeace(n, other.id)) continue;
    if (counts[id] > best) { best = counts[id]; foe = other; }
  }
  if (!foe || best < 6) return;
  const chance = open > 14 ? 0.015 : open > 4 ? 0.045 : 0.09;
  if (rnd() < chance) declareWar(n, foe);
}

function warPush(n) {
  const foeId = [...n.atWar][0];
  const foe = byId(foeId);
  if (!foe) { n.atWar.clear(); return; }
  const cands = [];
  const seen = new Set();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (owner[y][x] !== n.id) continue;
    for (const [tx, ty] of neighbors(x, y)) {
      const k = key(tx, ty);
      if (seen.has(k) || owner[ty][tx] !== foe.id) continue;
      seen.add(k);
      let friends = 0;
      for (const [ax, ay] of neighbors(tx, ty)) if (owner[ay][ax] === n.id) friends++;
      cands.push({ tx, ty, friends, d: hypot(tx, ty, n.capital) });
    }
  }
  if (!cands.length) return;
  const maxF = cands.reduce((m, c) => Math.max(m, c.friends), 0);
  const top = cands.filter(c => c.friends === maxF).sort((a, b) => a.d - b.d).slice(0, 3);
  const m = top[ri(top.length)];
  const power = n.pops + ri(8);
  const defense = foe.pops + ri(8) + (m.tx === foe.capital.x && m.ty === foe.capital.y ? 12 : 0);
  if (power + m.friends * 4 > defense) {
    owner[m.ty][m.tx] = n.id;
    foe.stability -= 1.2;
  } else {
    n.stability -= 0.6;
  }
}

function settleWars() {
  const seen = new Set();
  for (const n of nations) {
    for (const id of [...n.atWar]) {
      const pair = n.id < id ? n.id + ":" + id : id + ":" + n.id;
      if (seen.has(pair)) continue;
      seen.add(pair);
      const foe = byId(id);
      if (!foe) { n.atWar.delete(id); continue; }
      const started = n.wars[id] || year;
      const border = borderCounts(n)[id] || 0;
      if (year - started > 16 + (n.id % 11) || border < 2) {
        makePeace(n, foe, 40 + ri(50));
        chronicle(year, n.name + " makes peace with " + foe.name + ".");
      }
    }
  }
}

function rebel(n) {
  const cells = cellsOf(n.id);
  if (cells.length < 36) return;
  const far = cells.filter(([x, y]) => hypot(x, y, n.capital) >= Math.max(8, n.reach * 0.62));
  if (far.length < 12) return;
  const comps = components(far);
  const chunk = comps.find(c => c.length >= 12 && c.length <= Math.floor(cells.length * 0.34));
  if (!chunk) return;
  const take = new Set(chunk.map(([x, y]) => key(x, y)));
  const remain = cells.filter(([x, y]) => !take.has(key(x, y)));
  if (components(remain).length !== 1 || remain.length < 20) return;
  let hx = chunk[0][0], hy = chunk[0][1], hd = -1;
  for (const [x, y] of chunk) {
    const d = hypot(x, y, n.capital);
    if (d > hd) { hd = d; hx = x; hy = y; }
  }
  const baby = found(hx, hy, nameRealm(), colors[ri(colors.length)]);
  for (const [x, y] of chunk) owner[y][x] = baby.id;
  baby.capital = { x: hx, y: hy };
  baby.quietUntil = year + 160;
  n.stability = Math.min(82, n.stability + 18);
  n.quietUntil = year + 160;
  makePeace(n, baby, 70 + ri(40));
  chronicle(year, baby.name + " breaks from " + n.name + ".");
}

function keepWhole() {
  for (const n of nations.slice()) {
    if (!nations.includes(n)) continue;
    const cells = cellsOf(n.id);
    if (cells.length < 2) continue;
    const comps = components(cells);
    if (comps.length < 2) continue;
    const main = comps[0];
    let cx = 0, cy = 0;
    for (const [x, y] of main) { cx += x; cy += y; }
    cx /= main.length; cy /= main.length;
    let best = main[0], bestD = Infinity;
    for (const [x, y] of main) {
      const d = Math.hypot(x - cx, y - cy);
      if (d < bestD) { bestD = d; best = [x, y]; }
    }
    n.capital = { x: best[0], y: best[1] };
    for (let i = 1; i < comps.length; i++) {
      const chunk = comps[i];
      if (chunk.length >= 18 && n.pops - chunk.length >= 18 && year >= (n.quietUntil || 0) && n.stability < 42) {
        let hx = chunk[0][0], hy = chunk[0][1], hd = -1;
        for (const [x, y] of chunk) {
          const d = hypot(x, y, n.capital);
          if (d > hd) { hd = d; hx = x; hy = y; }
        }
        const baby = found(hx, hy, nameRealm(), colors[ri(colors.length)]);
        for (const [x, y] of chunk) owner[y][x] = baby.id;
        baby.capital = { x: hx, y: hy };
        baby.quietUntil = year + 140;
        n.quietUntil = year + 140;
        makePeace(n, baby, 60);
        chronicle(year, baby.name + " is cut off from " + n.name + ".");
      } else {
        annex(chunk);
      }
    }
  }
}

function annex(chunk) {
  const mine = new Set(chunk.map(([x, y]) => key(x, y)));
  const counts = {};
  for (const [x, y] of chunk) {
    for (const [nx, ny] of neighbors(x, y)) {
      if (mine.has(key(nx, ny))) continue;
      const o = owner[ny][nx];
      if (o >= 0) counts[o] = (counts[o] || 0) + 1;
    }
  }
  let best = -1, bestN = 0;
  for (const id of Object.keys(counts)) if (counts[id] > bestN) { bestN = counts[id]; best = Number(id); }
  for (const [x, y] of chunk) owner[y][x] = best;
}

function absorbTiny() {
  for (const n of nations.slice()) {
    if (n.pops >= 8 || year - n.born < 40) continue;
    const cells = cellsOf(n.id);
    if (!cells.length) continue;
    annex(cells);
    chronicle(year, n.name + " fades.");
    n.pops = 0;
  }
  nations = nations.filter(n => n.pops > 0);
}

function seedEmptyContinent() {
  const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (seen[y][x] || grid[y][x] !== LAND) continue;
      const q = [[x, y]];
      const blob = [];
      let owned = 0;
      seen[y][x] = true;
      while (q.length) {
        const [cx, cy] = q.shift();
        blob.push([cx, cy]);
        if (owner[cy][cx] >= 0) owned++;
        for (const [nx, ny] of neighbors(cx, cy)) {
          if (!seen[ny][nx] && grid[ny][nx] === LAND) { seen[ny][nx] = true; q.push([nx, ny]); }
        }
      }
      if (owned === 0 && blob.length >= 40 && nations.length < 14) {
        const [sx, sy] = blob[Math.floor(blob.length / 2)];
        const n = found(sx, sy, nameRealm(), colors[ri(colors.length)]);
        claimDisk(n, 3);
        return;
      }
    }
  }
}

function markCoast() {
  coast = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== LAND) continue;
      if (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1 || neighbors(x, y).some(([nx, ny]) => grid[ny][nx] !== LAND)) coast[y][x] = true;
    }
  }
}

function tint(hex, toward, p) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const t = parseInt(toward.slice(1), 16);
  const tr = (t >> 16) & 255, tg = (t >> 8) & 255, tb = t & 255;
  r = Math.round(r + (tr - r) * p);
  g = Math.round(g + (tg - g) * p);
  b = Math.round(b + (tb - b) * p);
  return "rgb(" + r + "," + g + "," + b + ")";
}

function render() {
  const cw = canvas.width / COLS, ch = canvas.height / ROWS;
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, "#10192c");
  sky.addColorStop(1, "#070b14");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "rgba(170,198,230,0.045)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x += 10) {
    ctx.beginPath(); ctx.moveTo(x * cw, 0); ctx.lineTo(x * cw, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y += 10) {
    ctx.beginPath(); ctx.moveTo(0, y * ch); ctx.lineTo(canvas.width, y * ch); ctx.stroke();
  }
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== LAND) continue;
      const id = owner[y][x];
      const edge = coast && coast[y][x];
      let fill = edge ? "#243028" : "#354238";
      if (id >= 0) {
        const base = byId(id)?.color || "#888888";
        fill = edge ? tint(base, "#10140f", 0.28) : base;
      }
      ctx.fillStyle = fill;
      ctx.fillRect(x * cw, y * ch, Math.ceil(cw) + 0.5, Math.ceil(ch) + 0.5);
    }
  }
  if (selected != null) {
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (owner[y][x] === selected) ctx.fillRect(x * cw, y * ch, Math.ceil(cw) + 0.5, Math.ceil(ch) + 0.5);
  }
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(214,226,214,0.38)";
  ctx.beginPath();
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== LAND) continue;
      if (x === COLS - 1 || grid[y][x + 1] !== LAND) { ctx.moveTo((x + 1) * cw, y * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch); }
      if (y === ROWS - 1 || grid[y + 1][x] !== LAND) { ctx.moveTo(x * cw, (y + 1) * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch); }
      if (x === 0 || grid[y][x - 1] !== LAND) { ctx.moveTo(x * cw, y * ch); ctx.lineTo(x * cw, (y + 1) * ch); }
      if (y === 0 || grid[y - 1][x] !== LAND) { ctx.moveTo(x * cw, y * ch); ctx.lineTo((x + 1) * cw, y * ch); }
    }
  }
  ctx.stroke();
  ctx.strokeStyle = "rgba(8,10,14,0.72)";
  ctx.beginPath();
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const id = owner[y][x];
      if (id < 0) continue;
      if (x < COLS - 1 && grid[y][x + 1] === LAND && owner[y][x + 1] !== id) {
        ctx.moveTo((x + 1) * cw, y * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch);
      }
      if (y < ROWS - 1 && grid[y + 1][x] === LAND && owner[y + 1][x] !== id) {
        ctx.moveTo(x * cw, (y + 1) * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch);
      }
    }
  }
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.88)";
  ctx.beginPath();
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (owner[y][x] !== selected) continue;
      if (x < COLS - 1 && grid[y][x + 1] === LAND && owner[y][x + 1] !== selected) { ctx.moveTo((x + 1) * cw, y * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch); }
      if (y < ROWS - 1 && grid[y + 1][x] === LAND && owner[y + 1][x] !== selected) { ctx.moveTo(x * cw, (y + 1) * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch); }
    }
  }
  ctx.stroke();
  const shade = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.width * 0.28, canvas.width / 2, canvas.height / 2, canvas.width * 0.72);
  shade.addColorStop(0, "rgba(0,0,0,0)");
  shade.addColorStop(1, "rgba(0,0,0,0.38)");
  ctx.fillStyle = shade;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0.14em";
  for (const n of nations) {
    if (!n.label || n.pops < 36) continue;
    const px = (n.label.x + 0.5) * cw, py = (n.label.y + 0.5) * ch;
    const size = n.pops > 220 ? 15 : n.pops > 90 ? 13 : 11;
    ctx.font = "600 " + size + "px \"Barlow Condensed\", \"Arial Narrow\", sans-serif";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(6,8,12,0.82)";
    ctx.strokeText(n.name.toUpperCase(), px, py);
    ctx.fillStyle = n.id === selected ? "#ffffff" : "rgba(244,247,252,0.88)";
    ctx.fillText(n.name.toUpperCase(), px, py);
  }
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  for (const n of nations) {
    if (!n.capital || !owner[n.capital.y] || owner[n.capital.y][n.capital.x] !== n.id) continue;
    const cx = (n.capital.x + 0.5) * cw, cy = (n.capital.y + 0.5) * ch;
    const r = Math.max(2.4, Math.min(cw, ch) * 0.28);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = "#f4f7fc"; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.48, 0, Math.PI * 2); ctx.fillStyle = n.color; ctx.fill();
  }
}

function row(label, value) {
  return '<div class="row"><span>' + label + '</span><b>' + value + '</b></div>';
}

function drawUI() {
  document.getElementById("year").textContent = String(year);
  const count = document.getElementById("count");
  if (count) count.textContent = nations.length + " REALMS";
  const focus = byId(selected);
  const foe = focus && focus.atWar.size ? byId([...focus.atWar][0]) : null;
  document.getElementById("focus").textContent = focus ? focus.name : "The world";
  document.getElementById("stats").innerHTML = focus
    ? row("Founded", focus.born) + row("Provinces", focus.pops) + row("Stability", Math.round(focus.stability)) + row("Reach", Math.round(focus.reach || 0)) + row("Status", foe ? "War with " + foe.name : "At peace")
    : row("Realms", nations.length);
  const list = document.getElementById("list");
  list.innerHTML = "";
  [...nations].sort((a, b) => b.pops - a.pops).slice(0, 14).forEach(n => {
    const li = document.createElement("li");
    if (n.id === selected) li.className = "on";
    li.innerHTML = '<i class="swatch" style="background:' + n.color + '"></i><span class="name">' + n.name + '</span><span class="num">' + n.pops + '</span>';
    li.onclick = () => { selected = n.id; drawUI(); };
    list.appendChild(li);
  });
  document.getElementById("log").innerHTML = logLines.map(l => {
    const i = l.indexOf(":");
    const y = i < 0 ? "" : l.slice(0, i);
    const t = i < 0 ? l : l.slice(i + 1).trim();
    return '<div class="ev"><span>' + y + '</span><p>' + t + '</p></div>';
  }).join("");
  document.getElementById("pause").textContent = paused ? "Resume" : "Pause";
}

canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * COLS);
  const y = Math.floor((e.clientY - r.top) / r.height * ROWS);
  if (grid && grid[y] && grid[y][x] === LAND && owner[y][x] >= 0) selected = owner[y][x];
  drawUI();
});
canvas.addEventListener("mousemove", e => {
  const tip = document.getElementById("tip");
  if (!tip || !grid) return;
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * COLS);
  const y = Math.floor((e.clientY - r.top) / r.height * ROWS);
  let label = "Ocean";
  if (grid[y] && grid[y][x] === LAND) label = owner[y][x] >= 0 ? (byId(owner[y][x])?.name || "Realm") : "Unclaimed";
  tip.textContent = label;
  tip.style.display = "block";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY + 14) + "px";
});
canvas.addEventListener("mouseleave", () => {
  const tip = document.getElementById("tip");
  if (tip) tip.style.display = "none";
});
document.getElementById("newmap").onclick = generate;
document.getElementById("pause").onclick = () => { paused = !paused; drawUI(); };
const speedBox = document.getElementById("speed");
if (speedBox && speedBox.querySelectorAll) {
  speedBox.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      speed = Number(b.dataset.s);
      speedBox.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    };
  });
}

let last = 0;
function loop(t) {
  if (!last) last = t;
  const dt = t - last;
  last = t;
  if (!paused) {
    acc += dt * speed;
    while (acc > 280) { acc -= 280; step(); }
    render();
  }
  requestAnimationFrame(loop);
}
resize();
generate();
requestAnimationFrame(loop);
</script>
</body>
