<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realmfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; --bg:#07080b; --line:rgba(255,255,255,.12); --ink:#f4f6f8; --dim:#8d95a3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100%; }
  header { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .pip { width: 7px; height: 7px; border-radius: 50%; background: #f4f7fc; box-shadow: 0 0 0 4px rgba(255,255,255,.06); }
  h1 { margin: 0; font: 600 16px/1 "Barlow Condensed", sans-serif; letter-spacing: .24em; }
  .brand p { margin: 3px 0 0; color: var(--dim); font: 500 10px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .16em; }
  .grow { flex: 1; }
  .controls { display: flex; align-items: center; gap: 8px; }
  button { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font: 500 12px/1 "Barlow Condensed", sans-serif; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  button:hover { border-color: rgba(255,255,255,.45); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; color: var(--dim); padding: 7px 11px; }
  .seg button.on { background: #f4f7fc; color: #090a0d; }
  .clock { min-width: 108px; text-align: right; }
  .clock .k, .kicker { color: var(--dim); font: 500 10px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .16em; }
  .clock strong { display: block; margin-top: 4px; font: 500 18px/1 "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .clock em { display: block; margin-top: 4px; color: var(--dim); font: 500 10px/1 "IBM Plex Mono", ui-monospace, monospace; font-style: normal; letter-spacing: .12em; }
  #wrap { flex: 1; display: flex; min-height: 0; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { width: 100%; height: 100%; display: block; background: #070b14; cursor: crosshair; }
  #tip { position: fixed; z-index: 4; display: none; pointer-events: none; padding: 6px 8px; background: rgba(8,10,14,.9); border: 1px solid rgba(255,255,255,.16); color: #f4f7fc; font: 500 12px/1 "Barlow Condensed", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  aside { width: 360px; overflow: auto; padding: 16px 18px 28px; background: #08090c; border-left: 1px solid var(--line); }
  .kicker { margin: 18px 0 6px; }
  .kicker.sub { margin: 14px 0 0; }
  aside h2 { margin: 0; font: 600 30px/0.95 "Barlow Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  #subtitle { margin: 6px 0 0; color: var(--dim); font: 500 11px/1.3 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
  #blurb { margin: 8px 0 0; color: var(--dim); font-size: 12.5px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .row b { color: var(--ink); font: 500 13px/1 "IBM Plex Mono", ui-monospace, monospace; font-weight: 500; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.06); cursor: pointer; font: 500 15px/1 "Barlow Condensed", sans-serif; letter-spacing: .05em; text-transform: uppercase; }
  li.on .name { color: #fff; }
  li .num { margin-left: auto; color: var(--dim); font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0; text-transform: none; }
  .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .tabs button { flex: 1; border: 0; border-radius: 0; color: var(--dim); padding: 8px 0; letter-spacing: .08em; }
  .tabs button.on { background: #f4f7fc; color: #090a0d; }
  #log .ev, .ev { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.06); }
  .ev span { color: var(--dim); font: 500 11px/1.4 "IBM Plex Mono", ui-monospace, monospace; }
  .ev p { margin: 0; color: #d7dce4; font-size: 12.5px; }
  @media (max-width: 860px) {
    header { flex-wrap: wrap; }
    .grow { display: none; }
    #wrap { flex-direction: column; }
    aside { width: auto; max-height: 42vh; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <i class="pip"></i>
    <div>
      <h1>REALMFALL</h1>
      <p>WORLD SIMULATION</p>
    </div>
  </div>
  <div class="grow"></div>
  <div class="controls">
    <button id="newmap" type="button">New map</button>
    <button id="pause" type="button">Pause</button>
    <div class="seg" id="layer">
      <button type="button" data-m="politics" class="on">States</button>
      <button type="button" data-m="faith">Faith</button>
    </div>
    <div class="seg" id="speed">
      <button type="button" data-s="1">1×</button>
      <button type="button" data-s="2" class="on">2×</button>
      <button type="button" data-s="4">4×</button>
      <button type="button" data-s="8">8×</button>
    </div>
  </div>
  <div class="clock">
    <span class="k">YEAR</span>
    <strong id="year">—</strong>
    <em id="count"></em>
  </div>
</header>
<div id="wrap">
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="tip"></div>
  </div>
  <aside>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="realm" class="on">Realm</button>
      <button type="button" data-tab="world">World</button>
      <button type="button" data-tab="faith">Faith</button>
      <button type="button" data-tab="log">Log</button>
    </div>
    <div id="panel"></div>
  </aside>
</div>
<script>
const COLS = 120, ROWS = 78;
const LAND = 1, WATER = 0;
const prefixes = ["Ash","Dun","Kor","Vel","Mar","Ost","Ryn","Hal","Tor","Brae","Quel","Sar","Ith","Nor","Caer","Wyn","Gal","Thal","Eld","Mir"];
const suffixes = ["wald","heim","dor","reach","mark","hold","ia","und","fen","gard","mere","wyn","oth","lan","bar","ric","moor","stead","vane","spire"];
const citySuffixes = ["ton","ford","port","burgh","haven","bridge","mouth","kirk","wick","stad"];
const colors = ["#d4655c","#e0ae58","#4eae9c","#6d90d6","#c96b9a","#e08a45","#8fb45e","#c9a06a","#3f9178","#d46d78","#b59a48","#3e8c96","#d48462","#7d74d0","#d2c15a","#5a9a55","#c45656","#4d7eb8","#d49a74","#8a8648"];

const FAITH_POOL = ["Ashen Rite", "High Canon", "Old Grove", "Sun Creed", "Pale Choir", "Iron Psalm"];
const FAITH_COLORS = ["#c4a574", "#7f97a8", "#7ea36d", "#c48b9a", "#d2c07a", "#8d7cc4"];
const GOVS = ["Monarchy", "Republic", "Dictatorship", "Oligarchy", "Theocracy"];

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let grid, owner, prev, pop, belief, faithNames, canals, continents, nations, year, paused, selected, logLines, acc, seed, coast;
let elev, river, riverSys, flowToX, flowToY;
let nextId = 1;
let nextCity = 1;
let cities = [];
let speed = 2;
let mapMode = "politics";
let tab = "realm";

function govLabel(g) {
  if (g === "Republic") return "Democratic republic";
  return g || "Monarchy";
}
function govArticle(g) {
  if (g === "Republic") return "a democratic republic";
  if (g === "Oligarchy") return "an oligarchy";
  if (g === "Theocracy") return "a theocracy";
  if (g === "Dictatorship") return "a dictatorship";
  return "a monarchy";
}
function faithColor(i) { return FAITH_COLORS[i % FAITH_COLORS.length]; }
function rules(g) {
  return {
    Monarchy: { hold: 0.92, bully: 0.15, trade: 0.2, zeal: 0, military: 1, grow: 1, sea: 1.12, heart: 1.28, poor: 1 },
    Republic: { hold: 0.7, bully: 0.22, trade: 1, zeal: 0, military: 0.94, grow: 1.12, sea: 1.7, heart: 1.02, poor: 0.82 },
    Dictatorship: { hold: 0.48, bully: 1, trade: 0.25, zeal: 0, military: 1.24, grow: 0.84, sea: 1.05, heart: 1.05, poor: 1.12 },
    Oligarchy: { hold: 0.66, bully: 0.35, trade: 1.3, zeal: 0, military: 0.9, grow: 1.02, sea: 2.05, heart: 0.92, poor: 0.68 },
    Theocracy: { hold: 0.78, bully: 0.18, trade: 0.25, zeal: 1, military: 1.02, grow: 0.96, sea: 1.08, heart: 1.1, poor: 1 }
  }[g] || { hold: 0.9, bully: 0.2, trade: 0.2, zeal: 0, military: 1, grow: 1, sea: 1.1, heart: 1.1, poor: 1 };
}
function norm3(s) {
  const t = (s[0] + s[1] + s[2]) || 1;
  return [s[0] / t, s[1] / t, s[2] / t];
}
function topFaith(x, y) {
  const s = belief && belief[y] && belief[y][x];
  if (!s) return 0;
  return s[1] > s[0] ? (s[2] > s[1] ? 2 : 1) : (s[2] > s[0] ? 2 : 0);
}
function mixFaithColor(shares) {
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < 3; i++) {
    const n = parseInt(faithColor(i).slice(1), 16);
    const w = shares[i] || 0;
    r += ((n >> 16) & 255) * w;
    g += ((n >> 8) & 255) * w;
    b += (n & 255) * w;
  }
  return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
}

function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function ri(n) { return Math.floor(rnd() * n); }
function pick(a) { return a[ri(a.length)]; }
function nameRealm() { return pick(prefixes) + pick(suffixes); }
function nameCity() {
  for (let i = 0; i < 8; i++) {
    const n = pick(prefixes) + pick(citySuffixes);
    if (!cities.some(c => c.name === n)) return n;
  }
  return pick(prefixes) + pick(citySuffixes) + (nextCity || 1);
}
function hypot(x, y, c) { const dx = x - c.x, dy = y - c.y; return Math.sqrt(dx * dx + dy * dy); }
function key(x, y) { return y * COLS + x; }

function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(320, r.width);
  canvas.height = Math.max(240, r.height);
}
window.addEventListener("resize", resize);

function neighbors(x, y) {
  const n = [];
  if (x > 0) n.push([x - 1, y]);
  if (x < COLS - 1) n.push([x + 1, y]);
  if (y > 0) n.push([x, y - 1]);
  if (y < ROWS - 1) n.push([x, y + 1]);
  return n;
}

function faithName(i) { return (faithNames && faithNames[i]) || "Old Rite"; }

function stamp(cx, cy, rx, ry) {
  const y0 = Math.max(1, Math.floor(cy - ry - 1));
  const y1 = Math.min(ROWS - 2, Math.ceil(cy + ry + 1));
  const x0 = Math.max(1, Math.floor(cx - rx - 1));
  const x1 = Math.min(COLS - 2, Math.ceil(cx + rx + 1));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const nx = (x - cx) / rx, ny = (y - cy) / ry;
      if (nx * nx + ny * ny < 1 + (rnd() - 0.5) * 0.35) grid[y][x] = LAND;
    }
  }
}

function carve(x0, x1, y0, y1) {
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const rx = (x1 - x0) * 0.46, ry = (y1 - y0) * 0.4;
  stamp(cx, cy, rx, ry);
  stamp(cx - rx * 0.3, cy + (rnd() - 0.5) * ry * 0.35, rx * 0.48, ry * 0.5);
  stamp(cx + rx * 0.24, cy - ry * 0.15, rx * 0.4, ry * 0.42);
}

function drown() {
  for (const c of canals) {
    for (let y = c.y0; y <= c.y1; y++) for (let x = c.x0; x <= c.x1; x++) {
      if (grid[y] && grid[y][x] != null) grid[y][x] = WATER;
    }
  }
}

function smoothLand() {
  const next = grid.map(row => row.slice());
  for (let y = 1; y < ROWS - 1; y++) {
    for (let x = 1; x < COLS - 1; x++) {
      let c = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) c += grid[y + dy][x + dx] === LAND;
      if (c >= 6) next[y][x] = LAND;
      else if (c <= 3) next[y][x] = WATER;
    }
  }
  grid = next;
  drown();
}

function landMasses(min) {
  const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  const masses = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (seen[y][x] || grid[y][x] !== LAND) continue;
    const q = [[x, y]];
    const blob = [];
    seen[y][x] = true;
    while (q.length) {
      const [cx, cy] = q.shift();
      blob.push([cx, cy]);
      for (const [nx, ny] of neighbors(cx, cy)) {
        if (!seen[ny][nx] && grid[ny][nx] === LAND) { seen[ny][nx] = true; q.push([nx, ny]); }
      }
    }
    if (blob.length >= min) masses.push(blob);
  }
  masses.sort((a, b) => b.length - a.length);
  return masses;
}

function hash2(ix, iy) {
  let n = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ (seed | 0);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const fx = x - x0, fy = y - y0;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(x0, y0), b = hash2(x0 + 1, y0), c = hash2(x0, y0 + 1), d = hash2(x0 + 1, y0 + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y) {
  let v = 0, a = 0.55, f = 1, s = 0;
  for (let i = 0; i < 5; i++) { v += vnoise(x * f, y * f) * a; s += a; a *= 0.5; f *= 2.08; }
  return v / s;
}

function layContinents() {
  canals = [];
  elev = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  const centers = rnd() < 0.4
    ? [{ x: 24 + ri(10), y: 22 + ri(8), r: 20 }, { x: 28 + ri(8), y: 56 + ri(6), r: 16 }, { x: 92 + ri(8), y: 38 + ri(12), r: 24 }]
    : [{ x: 30 + ri(12), y: 38 + ri(10), r: 24 }, { x: 90 + ri(10), y: 36 + ri(14), r: 23 }];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      let dome = 0;
      for (const c of centers) {
        const d = Math.hypot(x - c.x, y - c.y) / c.r;
        dome = Math.max(dome, Math.max(0, 1 - d * d));
      }
      const wx = fbm(x * 0.09, y * 0.09);
      const wy = fbm(x * 0.09 + 30, y * 0.09 + 12);
      const n = fbm((x + (wx - 0.5) * 22) * 0.065, (y + (wy - 0.5) * 22) * 0.065);
      const ridge = 1 - Math.abs(fbm(x * 0.04 + 8, y * 0.04) - 0.5) * 2;
      const h = dome * 0.5 + (n - 0.5) * 0.95 + (ridge - 0.5) * 0.28;
      elev[y][x] = h;
      grid[y][x] = h > 0.14 ? LAND : WATER;
    }
  }
  separateCenters(centers);
  for (let pass = 0; pass < 2; pass++) {
    const next = grid.map(row => row.slice());
    for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) {
      let c = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (grid[y + dy][x + dx] === LAND) c++;
      if (grid[y][x] === LAND && c <= 2) next[y][x] = WATER;
      else if (grid[y][x] !== LAND && c >= 8) next[y][x] = LAND;
    }
    grid = next;
  }
  for (const blob of landMasses(0)) if (blob.length < 55) for (const [x, y] of blob) grid[y][x] = WATER;
  traceRivers();
  continents = landMasses(80).length;
}

function separateCenters(centers) {
  const masses = landMasses(1);
  const at = (c) => {
    let best = null, bd = 1e9;
    for (const blob of masses) for (const [x, y] of blob) {
      const d = Math.hypot(x - c.x, y - c.y);
      if (d < bd) { bd = d; best = blob; }
    }
    return best;
  };
  for (let i = 0; i < centers.length; i++) for (let j = i + 1; j < centers.length; j++) {
    const A = centers[i], B = centers[j];
    if (at(A) !== at(B)) continue;
    const span = Math.hypot(A.x - B.x, A.y - B.y);
    for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) {
      if (grid[y][x] !== LAND) continue;
      const da = Math.hypot(x - A.x, y - A.y), db = Math.hypot(x - B.x, y - B.y);
      if (Math.abs(da - db) < 3.2 && da + db < span + 10 && elev[y][x] < 0.48) grid[y][x] = WATER;
    }
  }
}

function traceRivers() {
  river = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  riverSys = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  flowToX = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  flowToY = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  const acc = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  const order = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (grid[y][x] !== LAND) continue;
    acc[y][x] = 1;
    order.push([x, y]);
    let bx = -1, by = -1, bh = elev[y][x];
    for (const [nx, ny] of neighbors(x, y)) {
      const h = grid[ny][nx] === LAND ? elev[ny][nx] : elev[y][x] - 1;
      if (h < bh) { bh = h; bx = nx; by = ny; }
    }
    flowToX[y][x] = bx;
    flowToY[y][x] = by;
  }
  order.sort((a, b) => elev[b[1]][b[0]] - elev[a[1]][a[0]]);
  for (const [x, y] of order) {
    const nx = flowToX[y][x], ny = flowToY[y][x];
    if (nx >= 0 && grid[ny][nx] === LAND) acc[ny][nx] += acc[y][x];
  }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (acc[y][x] >= 11) river[y][x] = acc[y][x];
  let sid = 1;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (river[y][x] < 11 || riverSys[y][x]) continue;
    const q = [[x, y]];
    riverSys[y][x] = sid;
    while (q.length) {
      const [cx, cy] = q.shift();
      for (const [nx, ny] of neighbors(cx, cy)) {
        if (river[ny][nx] >= 11 && !riverSys[ny][nx]) { riverSys[ny][nx] = sid; q.push([nx, ny]); }
      }
    }
    sid++;
  }
}

function pickGov(x, y) {
  const shore = coast && coast[y] && coast[y][x];
  const r = rnd();
  if (r < 0.06) return "Theocracy";
  if (r < 0.22) return "Dictatorship";
  if (shore && r < 0.46) return "Oligarchy";
  if (shore && r < 0.76) return "Republic";
  if (!shore && r < 0.4) return "Republic";
  if (!shore && r < 0.52) return "Oligarchy";
  return "Monarchy";
}

function seedFaith() {
  const pool = FAITH_POOL.slice();
  faithNames = [];
  while (faithNames.length < 3 && pool.length) faithNames.push(pool.splice(ri(pool.length), 1)[0]);
  const spots = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[y][x] === LAND) spots.push([x, y]);
  const seeds = [];
  for (let i = 0; i < 3 && spots.length; i++) {
    let best = spots[0], bestD = -1;
    const tries = Math.min(80, spots.length);
    for (let t = 0; t < tries; t++) {
      const p = spots[ri(spots.length)];
      let d = 999;
      for (const s of seeds) d = Math.min(d, Math.hypot(p[0] - s[0], p[1] - s[1]));
      if (!seeds.length) d = 50;
      if (d > bestD) { bestD = d; best = p; }
    }
    seeds.push(best);
  }
  belief = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  for (const [x, y] of spots) {
    const raw = norm3(seeds.map(s => 1 / Math.pow(Math.hypot(x - s[0], y - s[1]) + 14, 1.35)));
    belief[y][x] = norm3(raw.map(v => v + 0.2));
  }
}

function generate() {
  seed = (Date.now() % 2000000000) + 1;
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(WATER));
  owner = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  prev = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  layContinents();
  markCoast();
  seedFaith();
  seedPop();
  nations = [];
  nextId = 1;
  nextCity = 1;
  cities = [];
  year = 800 + ri(400);
  logLines = [];
  const spots = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[y][x] === LAND) spots.push([x, y]);
  const start = 5 + ri(3);
  const chosen = [];
  for (let i = 0; i < start && spots.length; i++) {
    let best = 0, bestScore = -1;
    const tries = Math.min(60, spots.length);
    for (let t = 0; t < tries; t++) {
      const j = ri(spots.length);
      const [x, y] = spots[j];
      let score = 999;
      for (const c of chosen) score = Math.min(score, Math.hypot(x - c.x, y - c.y));
      if (score > bestScore) { bestScore = score; best = j; }
    }
    const [x, y] = spots.splice(best, 1)[0];
    if (chosen.some(c => Math.hypot(x - c.x, y - c.y) < 12)) continue;
    chosen.push({ x, y });
    const name = nameRealm();
    const n = found(x, y, name, colors[i % colors.length]);
    claimDisk(n, 3);
  }
  selected = nations[0] ? nations[0].id : null;
  logLines.push(year + ": A new age begins. " + continents + " continents. People carry the faiths. States do not.");
  acc = 0;
  recount();
  render();
  drawUI();
}

function found(x, y, name, color, why, gov, faithId) {
  const id = nextId++;
  const f = faithId == null ? topFaith(x, y) : faithId;
  const g = gov || pickGov(x, y);
  const n = {
    id, name, color, born: year || 1000, stability: 70, legitimacy: 68, pops: 1,
    capital: { x, y }, label: { x, y }, atWar: new Set(), peace: {}, wars: {}, quietUntil: (year || 1000) + 80,
    bearing: rnd() * Math.PI * 2, drive: 0.35 + rnd() * 0.5, bold: 0.4 + rnd() * 0.6,
    faith: f, gov: g, grievance: {}, gnote: {}, unrest: 0, pact: {}
  };
  nations.push(n);
  const seat = placeCity(x, y, nameCity(), "city");
  n.seat = seat.id;
  n.capital = { x, y };
  if (grid[y] && grid[y][x] === LAND) claim(x, y, id);
  const crown = name + " is founded as " + govArticle(g) + (g === "Theocracy" ? ". The cult is " + faithName(f) + ", which the capital's people already follow." : ".");
  chronicle(year || 1000, why || crown);
  return n;
}

function claim(x, y, id) {
  if (!prev) prev = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  if (owner[y][x] !== id) {
    if (owner[y][x] >= 0 && id >= 0 && pop && pop[y][x]) {
      const city = cities.find(c => c.x === x && c.y === y);
      const seat = city && nations.some(n => n.seat === city.id && n.capital && n.capital.x === x && n.capital.y === y);
      const keep = !city ? 0.93 : seat ? 0.52 : city.rank === "city" ? 0.64 : 0.78;
      pop[y][x] = Math.max(160, Math.round(pop[y][x] * keep));
    }
    prev[y][x] = owner[y][x];
  }
  owner[y][x] = id;
}

function claimDisk(n, r) {
  const c = n.capital;
  for (let y = Math.max(0, c.y - r); y <= Math.min(ROWS - 1, c.y + r); y++) {
    for (let x = Math.max(0, c.x - r); x <= Math.min(COLS - 1, c.x + r); x++) {
      if (grid[y][x] !== LAND || owner[y][x] >= 0) continue;
      if (hypot(x, y, c) <= r) claim(x, y, n.id);
    }
  }
}

function chronicle(y, text) {
  if (!logLines) logLines = [];
  logLines.unshift(y + ": " + text);
  logLines = logLines.slice(0, 16);
}

function byId(id) { return nations.find(n => n.id === id); }
function atPeace(n, id) { return (n.peace[id] || 0) > year; }

function makePeace(a, b, years) {
  a.atWar.delete(b.id);
  b.atWar.delete(a.id);
  delete a.wars[b.id];
  delete b.wars[a.id];
  const until = year + years;
  a.peace[b.id] = until;
  b.peace[a.id] = until;
  if (a.grievance) a.grievance[b.id] = 15;
  if (b.grievance) b.grievance[a.id] = 15;
}

function pactOn(n, id) { return !!(n.pact && n.pact[id] > year); }

function declareWar(n, foe, why) {
  if (!foe || n.atWar.size || foe.atWar.size || atPeace(n, foe.id)) return false;
  n.atWar.add(foe.id);
  foe.atWar.add(n.id);
  n.wars[foe.id] = { year, pops: n.pops };
  foe.wars[n.id] = { year, pops: foe.pops };
  for (const other of nations) {
    if (other.id === n.id || other.id === foe.id || !pactOn(other, foe.id)) continue;
    if (!other.grievance) other.grievance = {};
    if (!other.gnote) other.gnote = {};
    other.grievance[n.id] = (other.grievance[n.id] || 0) + 55;
    other.gnote[n.id] = "because the river trade with " + foe.name + " is cut";
  }
  chronicle(year, why);
  return true;
}

function cellsOf(id) {
  const cells = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (owner[y][x] === id) cells.push([x, y]);
  return cells;
}

function components(cells) {
  const set = new Set(cells.map(([x, y]) => key(x, y)));
  const seen = new Set();
  const comps = [];
  for (const [x, y] of cells) {
    const k0 = key(x, y);
    if (seen.has(k0)) continue;
    const comp = [];
    const q = [[x, y]];
    seen.add(k0);
    while (q.length) {
      const [cx, cy] = q.shift();
      comp.push([cx, cy]);
      for (const [nx, ny] of neighbors(cx, cy)) {
        const k = key(nx, ny);
        if (!seen.has(k) && set.has(k)) { seen.add(k); q.push([nx, ny]); }
      }
    }
    comps.push(comp);
  }
  comps.sort((a, b) => b.length - a.length);
  return comps;
}

function recount() {
  for (const n of nations) n.pops = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const id = owner[y][x];
    if (id >= 0) { const n = byId(id); if (n) n.pops++; }
  }
  nations = nations.filter(n => n.pops > 0);
}

function step() {
  year++;
  demography();
  culture();
  growCities();
  recount();
  const claimants = nations.slice();
  for (const n of claimants) {
    if (!nations.includes(n) || n.pops === 0) continue;
    settleCapital(n);
    measure(n);
    if (n.atWar.size) warPush(n);
    else {
      grow(n);
      considerWar(n);
    }
  }
  considerPacts();
  settleWars();
  for (const n of nations.slice()) considerCollapse(n);
  nations = nations.filter(n => n.pops > 0);
  for (const n of nations.slice()) considerRevolt(n);
  keepWhole();
  absorbTiny();
  if (year % 35 === 0) seedEmptyContinent();
  recount();
  for (const n of nations) holdSeat(n);
  recount();
  drawUI();
}

function placeCity(x, y, name, rank) {
  let c = cities.find(c => c.x === x && c.y === y);
  if (c) {
    if (rank === "city" && c.rank === "town") c.rank = "city";
    return c;
  }
  c = { id: nextCity++, name, x, y, rank: rank || "town" };
  cities.push(c);
  if (pop && pop[y] && rank === "city" && (pop[y][x] || 0) < 1800) pop[y][x] = 1800 + ri(500);
  return c;
}

function citiesIn(cells) {
  const set = new Set(cells.map(([x, y]) => key(x, y)));
  return cities.filter(c => set.has(key(c.x, c.y)));
}

function siteKind(x, y) {
  const onRiver = river && river[y][x] > 11;
  if (onRiver && coast && coast[y][x]) return "mouth";
  if (onRiver) return "river";
  if (coast && coast[y][x]) return "coast";
  return "inland";
}

function capacity(x, y) {
  const id = owner[y][x];
  const n = id >= 0 ? byId(id) : null;
  const kind = siteKind(x, y);
  let K = 1000;
  if (kind === "river") K += 620;
  if (kind === "mouth") K += 480;
  if (kind === "coast") K += 140;
  if (elev && elev[y][x] > 0.58) K -= 280;
  const city = cities.find(c => c.x === x && c.y === y);
  if (n) {
    const R = rules(n.gov);
    const d = n.capital ? hypot(x, y, n.capital) : 9;
    if (d < 6) K += 180 * R.heart;
    if (n.gov === "Oligarchy") K *= kind === "inland" ? 0.7 : kind === "mouth" || kind === "coast" ? 1.24 : 1.05;
    if (n.gov === "Republic" && kind === "inland") K *= 0.82;
    if (n.gov === "Theocracy" && belief && belief[y] && belief[y][x] && belief[y][x][n.faith] < 0.34) K *= 0.76;
    if ((n.legitimacy || 60) < 40) K *= 0.78;
    if (n.pacts) K *= 1 + Math.min(2, n.pacts) * 0.05;
    if (n.atWar.size) {
      const edge = neighbors(x, y).some(([nx, ny]) => owner[ny][nx] >= 0 && owner[ny][nx] !== id);
      K *= edge ? 0.58 : 0.9;
    }
  }
  if (city) {
    const seat = n && n.seat === city.id;
    K = Math.max(K, city.rank === "city" ? (seat ? 12500 : 8400) : 4300);
  }
  return Math.max(380, Math.round(K));
}

function growCities() {
  if (!pop || !owner) return;
  for (const c of cities) {
    if (c.rank !== "town") continue;
    if ((pop[c.y][c.x] || 0) < 5600) continue;
    c.rank = "city";
    const realm = byId(owner[c.y][c.x]);
    if (realm) chronicle(year, c.name + " has outgrown a town. It draws on the country around it.");
  }
  const founded = new Set();
  const sites = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (grid[y][x] !== LAND || owner[y][x] < 0) continue;
    if (cities.some(c => c.x === x && c.y === y)) continue;
    const realm = byId(owner[y][x]);
    if (!realm || realm.atWar.size || founded.has(realm.id)) continue;
    const kind = siteKind(x, y);
    const d = realm.capital ? hypot(x, y, realm.capital) : 9;
    if (kind === "inland" && (d > 5 || (pop[y][x] || 0) < 1500)) continue;
    const gap = kind === "mouth" || kind === "river" ? 6 : 8;
    if (cities.some(c => Math.hypot(c.x - x, c.y - y) < gap)) continue;
    let hinter = 0, surplus = 0, cells = 0;
    for (let yy = y - 4; yy <= y + 4; yy++) for (let xx = x - 4; xx <= x + 4; xx++) {
      if (yy < 0 || xx < 0 || yy >= ROWS || xx >= COLS || grid[yy][xx] !== LAND || owner[yy][xx] !== realm.id) continue;
      if (Math.hypot(xx - x, yy - y) > 4) continue;
      hinter += pop[yy][xx] || 0;
      surplus += Math.max(0, (pop[yy][xx] || 0) - capacity(xx, yy) * 0.72);
      cells++;
    }
    if (hinter < 7500 || surplus < 900) continue;
    const score = (kind === "mouth" ? 6 : kind === "river" ? 4 : kind === "coast" ? 2.5 : 1) + surplus / 4000;
    sites.push({ x, y, realm, kind, score });
  }
  sites.sort((a, b) => b.score - a.score);
  for (const s of sites) {
    if (founded.has(s.realm.id)) continue;
    const owned = cities.filter(c => owner[c.y][c.x] === s.realm.id).length;
    if (owned > Math.max(1, s.realm.pops / 40)) continue;
    const town = placeCity(s.x, s.y, nameCity(), "town");
    const why = s.kind === "mouth" ? "where the river meets the sea"
      : s.kind === "river" ? "on the river, where the country can spare the people"
      : s.kind === "coast" ? "on the coast, fed by the country behind it"
      : "to market the country around the capital";
    chronicle(year, town.name + " is chartered in " + s.realm.name + ", " + why + ".");
    founded.add(s.realm.id);
  }
}

function relocateSeat(n, lost, cells) {
  const set = new Set(cells.map(([x, y]) => key(x, y)));
  const taker = lost ? byId(owner[lost.y][lost.x]) : null;
  if (lost && pop[lost.y]) pop[lost.y][lost.x] = Math.max(160, pop[lost.y][lost.x] || 0);
  const shock = n.gov === "Dictatorship" ? 40 : n.gov === "Monarchy" || n.gov === "Theocracy" ? 36 : 28;
  n.legitimacy = Math.max(6, (n.legitimacy || 40) - shock);
  n.stability = Math.max(5, (n.stability || 30) - 24);
  if (cells.length < 16) {
    chronicle(year, (taker ? taker.name + " takes " + (lost ? lost.name : "the capital") + ". " : "") + n.name + " does not outlive its capital.");
    if (taker) for (const [x, y] of cells) if (owner[y][x] === n.id) claim(x, y, taker.id);
    else annex(cells);
    n.pops = 0;
    return;
  }
  const mine = citiesIn(cells).filter(c => !lost || c.id !== lost.id);
  const far = lost ? mine.filter(c => Math.hypot(c.x - lost.x, c.y - lost.y) > 2.4) : mine;
  const pool = far.length ? far : mine;
  pool.sort((a, b) => ((b.rank === "city") - (a.rank === "city")) || ((pop[b.y][b.x] || 0) - (pop[a.y][a.x] || 0)));
  if (pool.length) {
    const next = pool[0];
    if (next.rank === "town") next.rank = "city";
    n.seat = next.id;
    n.capital = { x: next.x, y: next.y };
    chronicle(year, (taker && lost ? taker.name + " takes " + lost.name + ", capital of " + n.name + ". " : "The court of " + n.name + " is displaced. ") + "It removes to " + next.name + ".");
    return;
  }
  let best = cells[0], bestS = -1;
  const distant = lost ? cells.filter(([x, y]) => Math.hypot(x - lost.x, y - lost.y) > 4) : cells;
  for (const [x, y] of (distant.length ? distant : cells)) {
    const s = pop[y][x] || 0;
    if (s > bestS && set.has(key(x, y))) { bestS = s; best = [x, y]; }
  }
  const town = placeCity(best[0], best[1], nameCity(), "town");
  n.seat = town.id;
  n.capital = { x: best[0], y: best[1] };
  n.legitimacy = Math.max(6, n.legitimacy - 8);
  chronicle(year, (taker && lost ? taker.name + " takes " + lost.name + ", capital of " + n.name + ". " : "") + "There is no other city. A thin court sits at " + town.name + ".");
}

function holdSeat(n) {
  if (!nations.includes(n)) return;
  const seat = cities.find(c => c.id === n.seat);
  if (seat && owner[seat.y] && owner[seat.y][seat.x] === n.id) {
    n.capital = { x: seat.x, y: seat.y };
    return;
  }
  const cells = cellsOf(n.id);
  if (!cells.length) return;
  relocateSeat(n, seat, cells);
}

function settleCapital(n) { holdSeat(n); }

function measure(n) {
  const cells = cellsOf(n.id);
  n.pops = cells.length;
  if (!cells.length) { n.reach = 0; n.people = 0; return; }
  let maxD = 0, sum = 0, sx = 0, sy = 0, people = 0, shores = 0, wealth = 0;
  const believers = [0, 0, 0];
  const R = rules(n.gov);
  n.rivers = new Set();
  for (const [x, y] of cells) {
    const d = hypot(x, y, n.capital);
    if (d > maxD) maxD = d;
    sum += d;
    sx += x;
    sy += y;
    const souls = (pop && pop[y][x]) || 0;
    people += souls;
    const shares = belief && belief[y][x];
    if (shares) for (let i = 0; i < 3; i++) believers[i] += souls * shares[i];
    const sea = coast && coast[y] && coast[y][x];
    if (sea) shores++;
    if (riverSys && riverSys[y][x]) n.rivers.add(riverSys[y][x]);
    const mouth = sea && river && river[y][x] > 11;
    let w = souls / 800;
    if (sea) w *= R.sea;
    if (river && river[y][x] > 11) w *= 1.14;
    if (mouth) w *= R.trade > 0.5 ? 1.32 : 1.1;
    if (d < 5) w *= R.heart;
    if (souls < 1500) w *= R.poor;
    wealth += w;
  }
  n.reach = maxD;
  n.people = people;
  n.coasts = shores;
  let pacts = 0;
  if (n.pact) for (const id of Object.keys(n.pact)) if (n.pact[id] > year) pacts++;
  n.pacts = pacts;
  wealth *= 1 + pacts * 0.07;
  n.wealth = Math.round(wealth);
  n.avg = sum / cells.length;
  n.label = { x: sx / cells.length, y: sy / cells.length };
  let top = 0;
  for (let i = 1; i < 3; i++) if (believers[i] > believers[top]) top = i;
  n.creed = top;
  n.creedShare = people ? believers[top] / people : 0;
  n.cultShare = people ? believers[n.faith] / people : 0;
  n.believers = believers;
  n.homo = n.creedShare;
  let warYears = 0;
  if (n.atWar.size) {
    const foe = [...n.atWar][0];
    warYears = year - ((n.wars[foe] && n.wars[foe].year) || year);
  }
  const rich = wealth / Math.max(1, cells.length);
  let target = 60;
  if (n.gov === "Monarchy") target = 80 - Math.max(0, n.avg - 9) * 2.4;
  else if (n.gov === "Republic") target = 40 + Math.min(42, rich * 7);
  else if (n.gov === "Oligarchy") target = 36 + Math.min(28, (shores / cells.length) * 90) + Math.min(18, rich * 3);
  else if (n.gov === "Dictatorship") target = 70 - Math.min(28, warYears * 1.1) - (n.atWar.size ? 8 : 0);
  else if (n.gov === "Theocracy") target = 32 + n.cultShare * 62;
  target = Math.max(12, Math.min(94, target));
  n.legitimacy = (n.legitimacy == null ? 68 : n.legitimacy) + (target - n.legitimacy) * 0.08;
  n.stability += (n.legitimacy - n.stability) * 0.06;
  if (n.atWar.size) n.stability -= n.gov === "Dictatorship" ? 0.45 : 0.22;
  n.stability = Math.max(4, Math.min(100, n.stability));
}

function emptyFrontier(n) {
  const moves = [];
  const seen = new Set();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (owner[y][x] !== n.id) continue;
    for (const [tx, ty] of neighbors(x, y)) {
      const k = key(tx, ty);
      if (seen.has(k) || grid[ty][tx] !== LAND || owner[ty][tx] >= 0) continue;
      seen.add(k);
      let friends = 0;
      for (const [ax, ay] of neighbors(tx, ty)) if (owner[ay][ax] === n.id) friends++;
      moves.push({ tx, ty, d: hypot(tx, ty, n.capital), friends });
    }
  }
  return moves;
}

function grow(n) {
  let moves = emptyFrontier(n);
  if (!moves.length) return;
  const thick = moves.filter(m => m.friends >= 2 || (coast && coast[m.ty] && coast[m.ty][m.tx]));
  if (thick.length > 2) moves = thick;
  const reach = Math.max(3, n.reach || 3);
  const R = rules(n.gov);
  const bx = Math.cos(n.bearing || 0), by = Math.sin(n.bearing || 0);
  for (const m of moves) {
    const dx = m.tx - n.capital.x, dy = m.ty - n.capital.y;
    const len = Math.hypot(dx, dy) || 1;
    const align = (dx / len) * bx + (dy / len) * by;
    const stretch = m.d > reach + 3 ? -2 : 0;
    const sea = coast && coast[m.ty][m.tx] ? R.trade * 2 : 0;
    const near = m.d < 8 ? R.hold * 1.4 : 0;
    m.score = m.friends * 3.2 + align * (n.drive || 0.5) * 2.2 + stretch + sea + near + rnd();
  }
  moves.sort((a, b) => b.score - a.score);
  let take = moves.length > 22 ? 3 : moves.length > 8 ? 2 : 1;
  if ((n.legitimacy || 60) < 42) take = 1;
  if (R.bully > 0.7 && (n.legitimacy || 60) > 58) take += 1;
  take = Math.min(moves.length, take);
  for (let i = 0; i < take; i++) {
    const m = moves[i];
    if (owner[m.ty][m.tx] >= 0) continue;
    claim(m.tx, m.ty, n.id);
  }
}

function borderCounts(n) {
  const counts = {};
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (owner[y][x] !== n.id) continue;
    for (const [tx, ty] of neighbors(x, y)) {
      const o = owner[ty][tx];
      if (o >= 0 && o !== n.id) counts[o] = (counts[o] || 0) + 1;
    }
  }
  return counts;
}

function lostBorder(n, foeId) {
  let c = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (owner[y][x] !== foeId || prev[y][x] !== n.id) continue;
    if (neighbors(x, y).some(([nx, ny]) => owner[ny][nx] === n.id)) c++;
  }
  return c;
}

function culture() {
  if (!belief) return;
  const next = belief.map(row => row.map(s => s ? s.slice() : null));
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== LAND || !belief[y][x]) continue;
      const mix = [0, 0, 0];
      const souls = pop && pop[y][x] ? pop[y][x] : 800;
      for (let i = 0; i < 3; i++) mix[i] = belief[y][x][i] * souls;
      let mass = souls;
      for (const [nx, ny] of neighbors(x, y)) {
        if (grid[ny][nx] !== LAND || !belief[ny][nx]) continue;
        const touch = Math.sqrt((pop && pop[ny][nx]) || 800) * 0.05;
        for (let i = 0; i < 3; i++) mix[i] += belief[ny][nx][i] * touch;
        mass += touch;
      }
      let shares = norm3(mix.map(v => v / mass));
      next[y][x] = shares;
    }
  }
  belief = next;
}

function considerWar(n) {
  if (n.atWar.size) return;
  if (!n.grievance) n.grievance = {};
  if (!n.gnote) n.gnote = {};
  const open = emptyFrontier(n).length;
  const counts = borderCounts(n);
  let best = null;
  for (const id of Object.keys(counts)) {
    const other = byId(Number(id));
    const border = counts[id];
    if (!other || border < 5) {
      n.grievance[id] = Math.max(0, (n.grievance[id] || 0) - 8);
      continue;
    }
    if (other.atWar.size || atPeace(n, other.id)) continue;
    if (pactOn(n, other.id)) {
      const reclaim = lostBorder(n, other.id);
      if (reclaim < 4) {
        n.grievance[id] = Math.max(0, (n.grievance[id] || 0) - 12);
        continue;
      }
      delete n.pact[other.id];
      if (other.pact) delete other.pact[n.id];
      chronicle(year, n.name + " breaks the trade peace with " + other.name + ".");
    }
    const R = rules(n.gov);
    const reasons = [];
    const reclaim = lostBorder(n, other.id);
    if (reclaim >= 2) reasons.push([24 + reclaim, "to recover land it lost"]);
    if (open < 5 && (n.people || 0) >= (other.people || 1) * 0.78) {
      reasons.push([4 + 7 * R.bully, "because no empty land remains"]);
    }
    if (R.bully > 0.6 && border >= 7 && (n.legitimacy || 0) > 48 && (n.people || 0) > (other.people || 1) * 1.12) {
      reasons.push([7 + 6 * R.bully, "because the neighbor is weaker"]);
    }
    if (R.trade > 0.7 && (other.wealth || 0) > (n.wealth || 0) * 1.1 && (other.coasts || 0) > (n.coasts || 0)) {
      reasons.push([7 + 6 * R.trade, "to take its ports and trade"]);
    }
    const theirs = other.people ? ((other.believers && other.believers[n.faith]) || 0) / other.people : 1;
    if (R.zeal && (n.cultShare || 0) > 0.6 && (n.homo || 0) > 0.55 && theirs < 0.22 && border >= 8) {
      reasons.push([5, "where its cult has no hold"]);
    }
    const leg = 0.62 + (n.legitimacy || 60) / 260;
    if (!reasons.length) {
      n.grievance[id] = Math.max(0, (n.grievance[id] || 0) - 10);
      continue;
    }
    reasons.sort((a, b) => b[0] - a[0]);
    n.grievance[id] = (n.grievance[id] || 0) + reasons.reduce((s, r) => s + r[0], 0) * leg;
    n.gnote[id] = reasons[0][1];
    if (!best || n.grievance[id] > best.score) best = { other, score: n.grievance[id], note: n.gnote[id] };
  }
  if (best && best.score >= 100) {
    n.grievance[best.other.id] = 0;
    declareWar(n, best.other, n.name + " goes to war with " + best.other.name + " " + best.note + ".");
  }
}

function severs(id, x, y) {
  const cells = [];
  for (let yy = 0; yy < ROWS; yy++) for (let xx = 0; xx < COLS; xx++) {
    if (owner[yy][xx] === id && (xx !== x || yy !== y)) cells.push([xx, yy]);
  }
  if (cells.length < 2) return false;
  return components(cells).length > 1;
}

function splitOff(id, x, y) {
  const cells = [];
  for (let yy = 0; yy < ROWS; yy++) for (let xx = 0; xx < COLS; xx++) {
    if (owner[yy][xx] === id && (xx !== x || yy !== y)) cells.push([xx, yy]);
  }
  if (cells.length < 2) return [];
  const comps = components(cells);
  if (comps.length < 2) return [];
  return comps.slice(1).flat();
}

function warPush(n) {
  const foeId = [...n.atWar][0];
  const foe = byId(foeId);
  if (!foe) { n.atWar.clear(); return; }
  const grabs = (n.people || 0) >= (foe.people || 1) * 0.9 ? 2 : 1;
  for (let g = 0; g < grabs; g++) {
    const cands = [];
    const seen = new Set();
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (owner[y][x] !== n.id) continue;
      for (const [tx, ty] of neighbors(x, y)) {
        const k = key(tx, ty);
        if (seen.has(k) || owner[ty][tx] !== foe.id) continue;
        seen.add(k);
        let friends = 0;
        for (const [ax, ay] of neighbors(tx, ty)) if (owner[ay][ax] === n.id) friends++;
        const coastCell = coast && coast[ty][tx];
        cands.push({ tx, ty, friends, d: hypot(tx, ty, n.capital), reclaim: prev[ty][tx] === n.id ? 1 : 0, coast: coastCell ? 1 : 0 });
      }
    }
    if (!cands.length) return;
    const R = rules(n.gov);
    for (const m of cands) {
      const port = m.coast && (cities.some(c => c.x === m.tx && c.y === m.ty) || (river && river[m.ty][m.tx] > 11));
      m.score = m.reclaim * 6 + m.friends + m.coast * (R.trade > 0.5 ? 2.4 : 0.8) + (port ? 2 : 0) - m.d * 0.02 + rnd();
    }
    cands.sort((a, b) => b.score - a.score);
    let moved = false;
    for (const m of cands) {
      const pocket = splitOff(foe.id, m.tx, m.ty);
      if (pocket.length > 8) continue;
      if (pocket.some(([x, y]) => foe.capital && x === foe.capital.x && y === foe.capital.y)) continue;
      const city = cities.find(c => c.x === m.tx && c.y === m.ty);
      const seat = foe.capital && m.tx === foe.capital.x && m.ty === foe.capital.y;
      const power = muster(n) * (0.94 + rnd() * 0.12);
      let defense = muster(foe) * (0.94 + rnd() * 0.12);
      const souls = (pop && pop[m.ty][m.tx]) || 0;
      if (city) defense *= (city.rank === "city" ? 1.18 : 1.1) + Math.min(0.06, souls / 80000);
      if (seat) {
        defense *= 1.34;
        if (foe.gov === "Monarchy" || foe.gov === "Theocracy") defense *= 1.14;
        if (foe.gov === "Dictatorship" && (foe.legitimacy || 0) > 55) defense *= 1.12;
        if ((foe.legitimacy || 0) < 36) defense *= 0.74;
      }
      if (foe.gov === "Theocracy" && belief && belief[m.ty][m.tx]) defense *= 0.84 + belief[m.ty][m.tx][foe.faith] * 0.45;
      if (city && m.coast && rules(foe.gov).trade > 0.7) defense *= 1.12;
      if (m.reclaim) defense *= 0.7;
      if (power * (1 + m.friends * 0.05) > defense) {
        claim(m.tx, m.ty, n.id);
        for (const [px, py] of pocket) claim(px, py, n.id);
        if (city && !seat) {
          foe.legitimacy = Math.max(6, (foe.legitimacy || 40) - (city.rank === "city" ? 9 : 4));
          foe.stability -= city.rank === "city" ? 7 : 3;
          chronicle(year, n.name + " sacks " + city.name + ". " + foe.name + " is thinner for it.");
        } else foe.stability -= 0.55;
      } else {
        n.stability -= city ? 0.7 : 0.35;
      }
      moved = true;
      break;
    }
    if (!moved) return;
  }
}

function sharesRiver(a, b) {
  if (!a.rivers || !b.rivers) return false;
  for (const id of a.rivers) if (b.rivers.has(id)) return true;
  return false;
}

function considerPacts() {
  for (let i = 0; i < nations.length; i++) {
    for (let j = i + 1; j < nations.length; j++) {
      const a = nations[i], b = nations[j];
      if (!a.pact) a.pact = {};
      if (!b.pact) b.pact = {};
      if (a.atWar.size || b.atWar.size || pactOn(a, b.id) || !sharesRiver(a, b)) continue;
      if ((borderCounts(a)[b.id] || 0) < 4) continue;
      if (a.gov === "Dictatorship" || b.gov === "Dictatorship") continue;
      const heat = ((a.grievance && a.grievance[b.id]) || 0) + ((b.grievance && b.grievance[a.id]) || 0);
      if (heat > 35) continue;
      const ap = Object.keys(a.pact).filter(id => a.pact[id] > year).length;
      const bp = Object.keys(b.pact).filter(id => b.pact[id] > year).length;
      if (ap >= 2 || bp >= 2) continue;
      a.pact[b.id] = year + 80;
      b.pact[a.id] = year + 80;
      chronicle(year, a.name + " and " + b.name + " keep a trade peace. A river runs through both.");
    }
  }
}

function settleWars() {
  const seen = new Set();
  for (const n of nations) {
    for (const id of [...n.atWar]) {
      const pair = n.id < id ? n.id + ":" + id : id + ":" + n.id;
      if (seen.has(pair)) continue;
      seen.add(pair);
      const foe = byId(id);
      if (!foe) { n.atWar.delete(id); continue; }
      const rec = n.wars[id] || { year, pops: n.pops };
      const foeRec = foe.wars[n.id] || { year, pops: foe.pops };
      const border = borderCounts(n)[id] || 0;
      const lostN = n.pops < rec.pops * 0.72;
      const lostF = foe.pops < foeRec.pops * 0.72;
      let why = "";
      if (border < 2) why = n.name + " and " + foe.name + " no longer share a border. The fighting ends.";
      else if (lostN) why = n.name + " sues for peace with " + foe.name + " after heavy losses.";
      else if (lostF) why = foe.name + " sues for peace with " + n.name + " after heavy losses.";
      else if (year - rec.year > 30 + (n.id % 14)) why = "The war between " + n.name + " and " + foe.name + " burns out.";
      if (!why) continue;
      makePeace(n, foe, 50 + ri(40));
      chronicle(year, why);
    }
  }
}

function considerCollapse(n) {
  if (!nations.includes(n) || !n.atWar.size || n.pops > 24 || n.stability > 24 || year - n.born < 30) return;
  const cells = cellsOf(n.id);
  if (cells.length < 2) return;
  const who = annex(cells);
  n.pops = 0;
  chronicle(year, who
    ? n.name + " breaks under the war. " + who.name + " occupies what remains."
    : n.name + " breaks under the war, and the land lies empty.");
}

function provinceStrain(n, x, y) {
  const d = hypot(x, y, n.capital);
  const R = rules(n.gov);
  const souls = (pop && pop[y][x]) || 0;
  const sea = coast && coast[y][x];
  let s = d > 11 ? (d - 11) * (1.2 - R.hold) * 0.18 : 0;
  if (souls < 1600 && !sea && R.trade > 0.6) s += 1.35;
  if (n.gov === "Dictatorship" && (n.legitimacy || 60) < 48) s += 1.5;
  if (n.gov === "Theocracy" && belief && belief[y][x] && belief[y][x][n.faith] < 0.34 && d > 8) s += (0.34 - belief[y][x][n.faith]) * 3.2;
  if (n.gov === "Monarchy" && d < 18) s *= 0.4;
  return s;
}

function considerRevolt(n) {
  if (!nations.includes(n) || n.atWar.size || year < (n.quietUntil || 0)) return;
  const cells = cellsOf(n.id);
  if (cells.length < 80 || (n.reach || 0) < 16) { n.unrest = Math.max(0, (n.unrest || 0) - 6); return; }
  const strained = cells.filter(([x, y]) => provinceStrain(n, x, y) > 1.15);
  if (strained.length < 8) { n.unrest = Math.max(0, (n.unrest || 0) - 6); return; }
  const region = components(strained).find(c => c.length >= 8);
  if (!region) { n.unrest = Math.max(0, (n.unrest || 0) - 6); return; }
  const cap = Math.min(14, Math.max(8, Math.floor(n.pops * 0.05)));
  let hx = region[0][0], hy = region[0][1], hd = -1;
  for (const [x, y] of region) {
    const d = hypot(x, y, n.capital);
    if (d > hd) { hd = d; hx = x; hy = y; }
  }
  const farSet = new Set(region.map(([x, y]) => key(x, y)));
  const blob = [];
  const seen = new Set([key(hx, hy)]);
  const q = [[hx, hy]];
  while (q.length && blob.length < cap) {
    q.sort((a, b) => hypot(b[0], b[1], n.capital) - hypot(a[0], a[1], n.capital));
    const [x, y] = q.shift();
    blob.push([x, y]);
    for (const [nx, ny] of neighbors(x, y)) {
      const k = key(nx, ny);
      if (seen.has(k) || !farSet.has(k)) continue;
      seen.add(k);
      q.push([nx, ny]);
    }
  }
  if (blob.length < 8) { n.unrest = Math.max(0, (n.unrest || 0) - 5); return; }
  const take = new Set(blob.map(([x, y]) => key(x, y)));
  const remain = cells.filter(([x, y]) => !take.has(key(x, y)));
  if (components(remain).length !== 1 || remain.length < n.pops * 0.86) {
    n.unrest = Math.max(0, (n.unrest || 0) - 5);
    return;
  }
  let gain = 4 + blob.reduce((s, [x, y]) => s + provinceStrain(n, x, y), 0) / blob.length;
  if ((n.legitimacy || 60) < 45) gain += 2;
  const biggest = nations.reduce((m, o) => Math.max(m, o.pops), 0);
  if (n.pops >= biggest) gain *= 0.55;
  n.unrest = (n.unrest || 0) + gain;
  if (n.unrest < 100) return;
  const babyName = nameRealm();
  const why = n.gov === "Theocracy" ? "does not share the capital's cult"
    : n.gov === "Dictatorship" ? "stops obeying the dictatorship"
    : n.gov === "Republic" ? "is poor, and a republic holds together by prosperity"
    : n.gov === "Oligarchy" ? "is inland, and the oligarchy spends on the ports"
    : "is farther than the monarchy can govern";
  const babyGov = n.gov === "Republic" ? "Republic" : n.gov === "Dictatorship" ? "Dictatorship" : n.gov === "Theocracy" ? "Theocracy" : "Monarchy";
  const baby = found(hx, hy, babyName, colors[ri(colors.length)], "A march of " + n.name + " " + why + ". " + babyName + " breaks away.", babyGov, topFaith(hx, hy));
  for (const [x, y] of blob) claim(x, y, baby.id);
  baby.capital = { x: hx, y: hy };
  baby.quietUntil = year + 180;
  baby.unrest = 0;
  n.unrest = 0;
  n.stability = Math.min(78, n.stability + 8);
  n.quietUntil = year + 180;
  makePeace(n, baby, 80);
}


function keepWhole() {
  for (const n of nations.slice()) {
    if (!nations.includes(n)) continue;
    const cells = cellsOf(n.id);
    if (cells.length < 2) continue;
    const comps = components(cells);
    if (comps.length < 2) continue;
    const main = comps[0];
    for (let i = 1; i < comps.length; i++) {
      const chunk = comps[i];
      if (chunk.length <= 12) {
        const who = annex(chunk);
        if (who && chunk.length >= 4) chronicle(year, who.name + " occupies ground cut off from " + n.name + ".");
      } else {
        peel(chunk, 3);
        if (!n.severNote || year > n.severNote) {
          chronicle(year, n.name + " is cut off from part of its land. Neighbors occupy it. No new crown is raised.");
          n.severNote = year + 40;
        }
      }
    }
  }
}

function annex(chunk) {
  const mine = new Set(chunk.map(([x, y]) => key(x, y)));
  const counts = {};
  for (const [x, y] of chunk) {
    for (const [nx, ny] of neighbors(x, y)) {
      if (mine.has(key(nx, ny))) continue;
      const o = owner[ny][nx];
      if (o >= 0) counts[o] = (counts[o] || 0) + 1;
    }
  }
  let best = -1, bestN = 0;
  for (const id of Object.keys(counts)) if (counts[id] > bestN) { bestN = counts[id]; best = Number(id); }
  for (const [x, y] of chunk) claim(x, y, best);
  return best >= 0 ? byId(best) : null;
}

function peel(chunk, limit) {
  const mine = new Set(chunk.map(([x, y]) => key(x, y)));
  const edge = [];
  for (const [x, y] of chunk) {
    for (const [nx, ny] of neighbors(x, y)) {
      if (mine.has(key(nx, ny))) continue;
      const o = owner[ny][nx];
      if (o >= 0) edge.push([x, y, o]);
    }
  }
  const seen = new Set();
  let k = 0;
  for (const [x, y, o] of edge) {
    const kk = key(x, y);
    if (seen.has(kk)) continue;
    seen.add(kk);
    claim(x, y, o);
    if (++k >= limit) break;
  }
}

function absorbTiny() {
  for (const n of nations.slice()) {
    if (!nations.includes(n) || n.pops >= 8 || year - n.born < 50) continue;
    const cells = cellsOf(n.id);
    if (!cells.length) continue;
    const who = annex(cells);
    chronicle(year, who ? n.name + " is too small to stand. " + who.name + " absorbs it." : n.name + " fades into empty land.");
    n.pops = 0;
  }
  nations = nations.filter(n => n.pops > 0);
}

function seedEmptyContinent() {
  const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (seen[y][x] || grid[y][x] !== LAND) continue;
      const q = [[x, y]];
      const blob = [];
      let owned = 0;
      seen[y][x] = true;
      while (q.length) {
        const [cx, cy] = q.shift();
        blob.push([cx, cy]);
        if (owner[cy][cx] >= 0) owned++;
        for (const [nx, ny] of neighbors(cx, cy)) {
          if (!seen[ny][nx] && grid[ny][nx] === LAND) { seen[ny][nx] = true; q.push([nx, ny]); }
        }
      }
      if (owned === 0 && blob.length >= 40 && nations.length < 14) {
        const [sx, sy] = blob[Math.floor(blob.length / 2)];
        const shore = nameRealm();
        const g = pickGov(sx, sy);
        const n = found(sx, sy, shore, colors[ri(colors.length)], shore + " is founded on an empty shore as " + govArticle(g) + ".", g);
        claimDisk(n, 3);
        return;
      }
    }
  }
}

function muster(n) {
  const R = rules(n.gov);
  const leg = (n.legitimacy || 60) / 100;
  const homo = n.homo || 0.7;
  return (n.people || n.pops * 1200) * R.military * (0.5 + 0.5 * leg) * (0.72 + 0.28 * homo);
}

function seedPop() {
  pop = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (grid[y][x] !== LAND) continue;
    const h = (Math.imul(x + 3, 374761393) ^ Math.imul(y + 5, 668265263)) >>> 0;
    let p = 800 + (h % 1600);
    if (coast[y][x]) p = Math.round(p * 0.82);
    pop[y][x] = p;
  }
}

function demography() {
  if (!pop) return;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (grid[y][x] !== LAND) continue;
    const id = owner[y][x];
    const n = id >= 0 ? byId(id) : null;
    const K = capacity(x, y);
    let r = 0.008;
    if (n) {
      r *= rules(n.gov).grow;
      const leg = n.legitimacy || 60;
      if (leg > 72) r *= 1.12;
      if (leg < 42) r *= 0.66;
      if (n.gov === "Theocracy" && belief && belief[y] && belief[y][x]) r *= 0.5 + (belief[y][x][n.faith] || 0);
      if (n.gov === "Dictatorship" && n.atWar.size) r *= 0.7;
    }
    let p = pop[y][x] || 400;
    p += p * r * (1 - p / K);
    if (n && n.atWar.size) {
      const edge = neighbors(x, y).some(([nx, ny]) => owner[ny][nx] >= 0 && owner[ny][nx] !== id);
      p *= edge ? 0.972 : 0.994;
    }
    pop[y][x] = Math.max(120, Math.round(p));
  }
  for (const c of cities) {
    const id = owner[c.y][c.x];
    if (id < 0) continue;
    const n = byId(id);
    const seat = n && n.seat === c.id;
    const rad = seat ? 6 : c.rank === "city" ? 5 : 3.6;
    const pull = seat ? 0.18 : c.rank === "city" ? 0.14 : 0.1;
    let moved = 0;
    for (let y = Math.max(0, c.y - 6); y <= Math.min(ROWS - 1, c.y + 6); y++) {
      for (let x = Math.max(0, c.x - 6); x <= Math.min(COLS - 1, c.x + 6); x++) {
        if (grid[y][x] !== LAND || owner[y][x] !== id || (x === c.x && y === c.y)) continue;
        if (cities.some(o => o.x === x && o.y === y)) continue;
        const dist = Math.hypot(x - c.x, y - c.y);
        if (dist > rad) continue;
        const surplus = (pop[y][x] || 0) - capacity(x, y);
        if (surplus < 40) continue;
        const take = Math.min(pop[y][x] - 160, Math.round(surplus * pull * (1 - dist / rad)));
        if (take <= 0) continue;
        pop[y][x] -= take;
        moved += take;
      }
    }
    pop[c.y][c.x] += moved;
  }
}

function markCoast() {
  coast = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== LAND) continue;
      if (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1 || neighbors(x, y).some(([nx, ny]) => grid[ny][nx] !== LAND)) coast[y][x] = true;
    }
  }
}

function tint(hex, toward, p) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const t = parseInt(toward.slice(1), 16);
  const tr = (t >> 16) & 255, tg = (t >> 8) & 255, tb = t & 255;
  r = Math.round(r + (tr - r) * p);
  g = Math.round(g + (tg - g) * p);
  b = Math.round(b + (tb - b) * p);
  return "rgb(" + r + "," + g + "," + b + ")";
}

function render() {
  const cw = canvas.width / COLS, ch = canvas.height / ROWS;
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, "#10192c");
  sky.addColorStop(1, "#070b14");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "rgba(170,198,230,0.045)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x += 10) {
    ctx.beginPath(); ctx.moveTo(x * cw, 0); ctx.lineTo(x * cw, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y += 10) {
    ctx.beginPath(); ctx.moveTo(0, y * ch); ctx.lineTo(canvas.width, y * ch); ctx.stroke();
  }
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== LAND) continue;
      const id = owner[y][x];
      const edge = coast && coast[y][x];
      let fill = edge ? "#243028" : "#354238";
      if (mapMode === "faith" && belief && belief[y][x]) {
        fill = mixFaithColor(belief[y][x]);
      } else if (id >= 0) {
        const base = byId(id)?.color || "#888888";
        fill = edge ? tint(base, "#10140f", 0.28) : tint(base, "#ffffff", Math.max(0, Math.min(0.14, ((pop && pop[y][x]) || 1000) / 28000)));
      }
      ctx.fillStyle = fill;
      ctx.fillRect(x * cw, y * ch, Math.ceil(cw) + 0.5, Math.ceil(ch) + 0.5);
    }
  }
  if (selected != null) {
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (owner[y][x] === selected) ctx.fillRect(x * cw, y * ch, Math.ceil(cw) + 0.5, Math.ceil(ch) + 0.5);
  }
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(214,226,214,0.38)";
  ctx.beginPath();
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== LAND) continue;
      if (x === COLS - 1 || grid[y][x + 1] !== LAND) { ctx.moveTo((x + 1) * cw, y * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch); }
      if (y === ROWS - 1 || grid[y + 1][x] !== LAND) { ctx.moveTo(x * cw, (y + 1) * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch); }
      if (x === 0 || grid[y][x - 1] !== LAND) { ctx.moveTo(x * cw, y * ch); ctx.lineTo(x * cw, (y + 1) * ch); }
      if (y === 0 || grid[y - 1][x] !== LAND) { ctx.moveTo(x * cw, y * ch); ctx.lineTo((x + 1) * cw, y * ch); }
    }
  }
  ctx.stroke();
  if (river && flowToX) {
    ctx.lineCap = "round";
    ctx.beginPath();
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (river[y][x] < 28 || flowToX[y][x] < 0) continue;
      ctx.moveTo((x + 0.5) * cw, (y + 0.5) * ch);
      ctx.lineTo((flowToX[y][x] + 0.5) * cw, (flowToY[y][x] + 0.5) * ch);
    }
    ctx.strokeStyle = "rgba(126,184,204,0.85)";
    ctx.lineWidth = 1.35;
    ctx.stroke();
    ctx.beginPath();
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (river[y][x] < 11 || river[y][x] >= 28 || flowToX[y][x] < 0) continue;
      ctx.moveTo((x + 0.5) * cw, (y + 0.5) * ch);
      ctx.lineTo((flowToX[y][x] + 0.5) * cw, (flowToY[y][x] + 0.5) * ch);
    }
    ctx.strokeStyle = "rgba(150,198,214,0.65)";
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
  ctx.strokeStyle = mapMode === "faith" ? "rgba(244,247,252,0.62)" : "rgba(8,10,14,0.72)";
  ctx.beginPath();
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const id = owner[y][x];
      if (id < 0) continue;
      if (x < COLS - 1 && grid[y][x + 1] === LAND && owner[y][x + 1] !== id) {
        ctx.moveTo((x + 1) * cw, y * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch);
      }
      if (y < ROWS - 1 && grid[y + 1][x] === LAND && owner[y + 1][x] !== id) {
        ctx.moveTo(x * cw, (y + 1) * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch);
      }
    }
  }
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.88)";
  ctx.beginPath();
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (owner[y][x] !== selected) continue;
      if (x < COLS - 1 && grid[y][x + 1] === LAND && owner[y][x + 1] !== selected) { ctx.moveTo((x + 1) * cw, y * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch); }
      if (y < ROWS - 1 && grid[y + 1][x] === LAND && owner[y + 1][x] !== selected) { ctx.moveTo(x * cw, (y + 1) * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch); }
    }
  }
  ctx.stroke();
  const shade = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.width * 0.28, canvas.width / 2, canvas.height / 2, canvas.width * 0.72);
  shade.addColorStop(0, "rgba(0,0,0,0)");
  shade.addColorStop(1, "rgba(0,0,0,0.38)");
  ctx.fillStyle = shade;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0.14em";
  for (const n of nations) {
    if (!n.label || n.pops < 36) continue;
    const px = (n.label.x + 0.5) * cw, py = (n.label.y + 0.5) * ch;
    const size = n.pops > 220 ? 15 : n.pops > 90 ? 13 : 11;
    ctx.font = "600 " + size + "px \"Barlow Condensed\", \"Arial Narrow\", sans-serif";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(6,8,12,0.82)";
    ctx.strokeText(n.name.toUpperCase(), px, py);
    ctx.fillStyle = n.id === selected ? "#ffffff" : "rgba(244,247,252,0.88)";
    ctx.fillText(n.name.toUpperCase(), px, py);
  }
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  for (const c of cities) {
    if (!owner[c.y] || owner[c.y][c.x] < 0) continue;
    if (nations.some(n => n.seat === c.id && n.pops > 0)) continue;
    const cx = (c.x + 0.5) * cw, cy = (c.y + 0.5) * ch;
    const rad = c.rank === "city" ? Math.max(1.7, Math.min(cw, ch) * 0.16) : Math.max(1.15, Math.min(cw, ch) * 0.1);
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fillStyle = "rgba(244,247,252,0.92)"; ctx.fill();
  }
  for (const n of nations) {
    if (!n.capital || !owner[n.capital.y] || owner[n.capital.y][n.capital.x] !== n.id) continue;
    const cx = (n.capital.x + 0.5) * cw, cy = (n.capital.y + 0.5) * ch;
    const r = Math.max(2.4, Math.min(cw, ch) * 0.28);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = "#f4f7fc"; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.48, 0, Math.PI * 2); ctx.fillStyle = n.color; ctx.fill();
  }
}

function fmt(n) {
  n = Math.round(n || 0);
  if (n >= 1000000) return (n / 1000000).toFixed(2) + "m";
  if (n >= 10000) return (n / 1000).toFixed(n >= 100000 ? 0 : 1) + "k";
  return String(n);
}

function row(label, value) {
  return '<div class="row"><span>' + label + '</span><b>' + value + '</b></div>';
}

function situation(n) {
  const foe = n.atWar.size ? byId([...n.atWar][0]) : null;
  if (foe) return "At war with " + foe.name + ". Strength is people, legitimacy, and how united those people are.";
  if (n.gov === "Republic") return "A democratic republic. Prosperity is its legitimacy. A poor interior can leave.";
  if (n.gov === "Oligarchy") return "An oligarchy. The ports pay for the state. The inland provinces do not share in it.";
  if (n.gov === "Theocracy") return "A theocracy. The cult is whatever the capital already believed. Neighbors change faith, not the state.";
  if (n.gov === "Dictatorship") return "A dictatorship. It fights harder while it is feared, and a long war eats that fear.";
  return "A monarchy. Distance is what it cannot hold. Faith is not its business.";
}

function faithCensus() {
  const rows = (faithNames || []).map((name, i) => ({ name, color: faithColor(i), people: 0 }));
  if (!belief) return rows;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (grid[y][x] !== LAND || !belief[y][x]) continue;
    const souls = (pop && pop[y][x]) || 0;
    for (let i = 0; i < 3; i++) rows[i].people += souls * belief[y][x][i];
  }
  return rows;
}

function chronicleHTML() {
  return logLines.map(l => {
    const i = l.indexOf(":");
    const y = i < 0 ? "" : l.slice(0, i);
    const t = i < 0 ? l : l.slice(i + 1).trim();
    return '<div class="ev"><span>' + y + '</span><p>' + t + '</p></div>';
  }).join("");
}

function drawUI() {
  document.getElementById("year").textContent = String(year);
  const count = document.getElementById("count");
  if (count) count.textContent = nations.length + " REALMS";
  const pause = document.getElementById("pause");
  if (pause) pause.textContent = paused ? "Resume" : "Pause";
  const tabs = document.getElementById("tabs");
  if (tabs && tabs.querySelectorAll) tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const layer = document.getElementById("layer");
  if (layer && layer.querySelectorAll) layer.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.m === mapMode));
  const panel = document.getElementById("panel");
  if (!panel) return;
  const focus = byId(selected);
  const foe = focus && focus.atWar.size ? byId([...focus.atWar][0]) : null;
  const people = nations.reduce((s, n) => s + (n.people || 0), 0);
  if (tab === "world") {
    let list = "";
    [...nations].sort((a, b) => (b.people || 0) - (a.people || 0)).forEach(n => {
      list += '<li class="' + (n.id === selected ? "on" : "") + '" data-id="' + n.id + '"><i class="swatch" style="background:' + n.color + '"></i><span class="name">' + n.name + '</span><span class="num">' + fmt(n.people) + '</span></li>';
    });
    panel.innerHTML = '<div class="kicker sub">WORLD</div>'
      + row("Continents", continents || 0)
      + row("Realms", nations.length)
      + row("Population", fmt(people))
      + '<div class="kicker">REALMS</div><ul id="list">' + list + '</ul>';
    panel.querySelectorAll("li").forEach(li => { li.onclick = () => { selected = Number(li.dataset.id); tab = "realm"; drawUI(); }; });
  } else if (tab === "faith") {
    const rows = faithCensus().map(f => '<li><i class="swatch" style="background:' + f.color + '"></i><span class="name">' + f.name + '</span><span class="num">' + fmt(f.people) + '</span></li>').join("");
    const cults = nations.filter(n => n.gov === "Theocracy").map(n => n.name).join(", ");
    panel.innerHTML = '<h2>Faith</h2><p id="blurb">Each province is a mix, not a flag. People pick up the faith of the people next to them, weighted by how many live there. The color on the Faith map is that mix. White lines are still the states.</p>'
      + '<div class="kicker">BELIEVERS</div><ul>' + rows + '</ul>'
      + '<div class="kicker">THEOCRACIES</div><p id="blurb">' + (cults || "None. A theocracy only keeps the cult its capital already had. It does not spread it.") + '</p>';
  } else if (tab === "log") {
    panel.innerHTML = '<div class="kicker">CHRONICLE</div><div id="log">' + chronicleHTML() + '</div>';
  } else {
    panel.innerHTML = focus
      ? '<h2>' + focus.name + '</h2><p id="subtitle">' + govLabel(focus.gov) + '</p><p id="blurb">' + situation(focus) + '</p>'
        + '<div class="kicker sub">PEOPLE</div>'
        + row("Population", fmt(focus.people))
        + row("Provinces", focus.pops)
        + row("Per province", fmt(focus.pops ? focus.people / focus.pops : 0))
        + row("Seat", (cities.find(c => c.id === focus.seat) || {}).name || "—")
        + row("Cities", cities.filter(c => owner[c.y] && owner[c.y][c.x] === focus.id).length)
        + row("Largest faith", faithName(focus.creed) + " " + Math.round((focus.creedShare || 0) * 100) + "%")
        + '<div class="kicker sub">STATE</div>'
        + row("Government", govLabel(focus.gov))
        + row("Legitimacy", Math.round(focus.legitimacy || 0))
        + row("River pacts", focus.pacts || 0)
        + row("Prosperity", fmt(focus.wealth))
        + row("Stability", Math.round(focus.stability))
        + row("Unrest", Math.round(focus.unrest || 0))
        + row("Status", foe ? "War with " + foe.name : "At peace")
      : '<h2>The world</h2><p id="blurb">Pick a realm on the map, or open World. Faith is a separate layer.</p>'
        + row("Continents", continents || 0)
        + row("Realms", nations.length)
        + row("Population", fmt(people));
  }
}

canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * COLS);
  const y = Math.floor((e.clientY - r.top) / r.height * ROWS);
  if (grid && grid[y] && grid[y][x] === LAND && owner[y][x] >= 0) { selected = owner[y][x]; tab = "realm"; }
  drawUI();
});
canvas.addEventListener("mousemove", e => {
  const tip = document.getElementById("tip");
  if (!tip || !grid) return;
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * COLS);
  const y = Math.floor((e.clientY - r.top) / r.height * ROWS);
  let label = "Ocean";
  if (grid[y] && grid[y][x] === LAND) {
    const souls = fmt(pop && pop[y] ? pop[y][x] : 0);
    const place = cities.find(c => c.x === x && c.y === y);
    const placeBit = place ? place.name + (owner[y][x] >= 0 && byId(owner[y][x])?.seat === place.id ? " · capital" : " · " + place.rank) + " · " : "";
    if (mapMode === "faith" && belief && belief[y] && belief[y][x]) {
      const s = belief[y][x];
      const order = [0, 1, 2].sort((a, b) => s[b] - s[a]);
      const who = owner[y][x] >= 0 ? (byId(owner[y][x])?.name || "Unclaimed") : "Unclaimed";
      label = placeBit + faithName(order[0]) + " " + Math.round(s[order[0]] * 100) + "%"
        + (s[order[1]] > 0.12 ? "  ·  " + faithName(order[1]) + " " + Math.round(s[order[1]] * 100) + "%" : "")
        + "  ·  " + who;
    } else if (owner[y][x] >= 0) {
      const n = byId(owner[y][x]);
      label = placeBit + (n ? n.name : "Realm") + "  ·  " + govLabel(n && n.gov) + "  ·  " + souls;
    } else label = "Unclaimed  ·  " + souls;
  }
  tip.textContent = label;
  tip.style.display = "block";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY + 14) + "px";
});
canvas.addEventListener("mouseleave", () => {
  const tip = document.getElementById("tip");
  if (tip) tip.style.display = "none";
});
document.getElementById("newmap").onclick = generate;
document.getElementById("pause").onclick = () => { paused = !paused; drawUI(); };
const tabsEl = document.getElementById("tabs");
if (tabsEl) tabsEl.onclick = e => {
  const b = e.target.closest && e.target.closest("button");
  if (!b) return;
  tab = b.dataset.tab;
  drawUI();
};
const layerEl = document.getElementById("layer");
if (layerEl) layerEl.onclick = e => {
  const b = e.target.closest && e.target.closest("button");
  if (!b) return;
  mapMode = b.dataset.m;
  drawUI();
  render();
};
const speedBox = document.getElementById("speed");
if (speedBox && speedBox.querySelectorAll) {
  speedBox.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      speed = Number(b.dataset.s);
      speedBox.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    };
  });
}

let last = 0;
function loop(t) {
  if (!last) last = t;
  const dt = t - last;
  last = t;
  if (!paused) {
    acc += dt * speed;
    while (acc > 280) { acc -= 280; step(); }
    render();
  }
  requestAnimationFrame(loop);
}
resize();
generate();
requestAnimationFrame(loop);
</script>
</body>
</html>
