<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realmfall — fantasy map toy</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14110e; color: #efe6d6; font: 14px/1.4 Georgia, "Palatino Linotype", serif; }
  body { display: flex; flex-direction: column; min-height: 100%; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: #1c1814; border-bottom: 1px solid #3a3126; }
  h1 { font-size: 18px; margin: 0; font-weight: normal; letter-spacing: 0.04em; }
  h1 span { color: #c4a574; }
  button, select { background: #2a241c; color: #efe6d6; border: 1px solid #5a4c38; border-radius: 4px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #3a3126; }
  #wrap { flex: 1; display: flex; min-height: 0; }
  canvas { flex: 1; width: 100%; height: 100%; display: block; cursor: crosshair; background: #1a2740; }
  aside { width: 280px; overflow: auto; padding: 12px 14px; background: #1a1612; border-left: 1px solid #3a3126; }
  aside h2 { font-size: 15px; margin: 0 0 6px; }
  .muted { color: #a89880; font-size: 12px; }
  .stat { margin: 8px 0; }
  ul { list-style: none; padding: 0; margin: 8px 0 0; }
  li { display: flex; gap: 8px; align-items: center; padding: 3px 0; border-bottom: 1px solid #2c261e; font-size: 13px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; }
  #log { margin-top: 12px; font-size: 12px; color: #cbbfaa; }
  #log div { margin: 0 0 6px; }
  @media (max-width: 800px) {
    #wrap { flex-direction: column; }
    aside { width: auto; max-height: 40vh; border-left: 0; border-top: 1px solid #3a3126; }
  }
</style>
</head>
<body>
<header>
  <h1>Realm<span>fall</span></h1>
  <button id="newmap">New map</button>
  <button id="pause">Pause</button>
  <select id="speed" aria-label="Speed">
    <option value="1">1x</option>
    <option value="2" selected>2x</option>
    <option value="4">4x</option>
    <option value="8">8x</option>
  </select>
  <span class="muted" id="year"></span>
</header>
<div id="wrap">
  <canvas id="map"></canvas>
  <aside>
    <h2 id="focus">The world</h2>
    <div class="muted" id="blurb">Dark marks are capitals. Realms grow outward from home. A long reach makes the frontier break off into a new realm.</div>
    <div class="stat" id="stats"></div>
    <ul id="list"></ul>
    <div id="log"></div>
  </aside>
</div>
<script>
const COLS = 120, ROWS = 78;
const LAND = 1, WATER = 0;
const prefixes = ["Ash","Dun","Kor","Vel","Mar","Ost","Ryn","Hal","Tor","Brae","Quel","Sar","Ith","Nor","Caer","Wyn","Gal","Thal","Eld","Mir"];
const suffixes = ["wald","heim","dor","reach","mark","hold","ia","und","fen","gard","mere","wyn","oth","lan","bar","ric","moor","stead","vane","spire"];
const colors = ["#c45c4a","#d4a017","#3d8c6e","#4f6d9a","#a85c8a","#c47a3a","#6e8b3d","#8d5e3c","#5c7a8a","#b04a5a","#7a6a3a","#3f7a6a","#9a5c3c","#6a4a8a","#a89050","#4a7a4a","#8a4a4a","#3a6a8a","#b07050","#5a5a3a"];

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let grid, owner, nations, year, paused, selected, logLines, acc, seed;

function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function ri(n) { return Math.floor(rnd() * n); }
function pick(a) { return a[ri(a.length)]; }
function nameRealm() { return pick(prefixes) + pick(suffixes); }

function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(320, r.width);
  canvas.height = Math.max(240, r.height);
}
window.addEventListener("resize", resize);

function neighbors(x, y) {
  const n = [];
  if (x > 0) n.push([x - 1, y]);
  if (x < COLS - 1) n.push([x + 1, y]);
  if (y > 0) n.push([x, y - 1]);
  if (y < ROWS - 1) n.push([x, y + 1]);
  return n;
}

function hypot(x, y, c) {
  const dx = x - c.x, dy = y - c.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function generate() {
  seed = (Date.now() % 2000000000) + 1;
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(WATER));
  owner = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  for (let i = 0; i < 7; i++) {
    let x = 8 + ri(COLS - 16), y = 6 + ri(ROWS - 12);
    for (let s = 0; s < 900; s++) {
      grid[y][x] = LAND;
      const dir = ri(4);
      x = Math.max(2, Math.min(COLS - 3, x + [1, -1, 0, 0][dir]));
      y = Math.max(2, Math.min(ROWS - 3, y + [0, 0, 1, -1][dir]));
    }
  }
  for (let p = 0; p < 4; p++) {
    const next = grid.map(row => row.slice());
    for (let y = 1; y < ROWS - 1; y++) {
      for (let x = 1; x < COLS - 1; x++) {
        let c = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) c += grid[y + dy][x + dx] === LAND;
        next[y][x] = c >= 5 ? LAND : WATER;
      }
    }
    grid = next;
  }
  nations = [];
  nextId = 1;
  year = 800 + ri(400);
  logLines = [];
  const spots = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[y][x] === LAND) spots.push([x, y]);
  const start = 6 + ri(4);
  const chosen = [];
  for (let i = 0; i < start && spots.length; i++) {
    let best = 0, bestScore = -1;
    const tries = Math.min(48, spots.length);
    for (let t = 0; t < tries; t++) {
      const j = ri(spots.length);
      const [x, y] = spots[j];
      let score = 999;
      for (const c of chosen) score = Math.min(score, Math.hypot(x - c.x, y - c.y));
      if (score > bestScore) { bestScore = score; best = j; }
    }
    const [x, y] = spots.splice(best, 1)[0];
    chosen.push({ x, y });
    found(x, y, nameRealm(), colors[i % colors.length]);
  }
  selected = nations[0] ? nations[0].id : null;
  logLines = [year + ": A new age begins. Crowns are few, and the marches are empty."];
  acc = 0;
  render();
  drawUI();
}

let nextId = 1;
function found(x, y, name, color) {
  const id = nextId++;
  const n = {
    id, name, color, born: year || 1000, stability: 72 + ri(20), pops: 1,
    capital: { x, y }, atWar: new Set(), peace: {}, wars: {}
  };
  nations.push(n);
  if (grid[y] && grid[y][x] === LAND) owner[y][x] = id;
  chronicle(year || 1000, name + " is founded.");
  return n;
}

function chronicle(y, text) {
  if (!logLines) logLines = [];
  logLines.unshift(y + ": " + text);
  logLines = logLines.slice(0, 12);
}

function byId(id) { return nations.find(n => n.id === id); }

function atPeace(n, id) { return (n.peace[id] || 0) > year; }

function makePeace(a, b, years) {
  a.atWar.delete(b.id);
  b.atWar.delete(a.id);
  delete a.wars[b.id];
  delete b.wars[a.id];
  a.peace[b.id] = year + years;
  b.peace[a.id] = year + years;
}

function declareWar(n, foe) {
  if (!foe || n.atWar.has(foe.id) || atPeace(n, foe.id)) return false;
  n.atWar.add(foe.id);
  foe.atWar.add(n.id);
  n.wars[foe.id] = year;
  foe.wars[n.id] = year;
  chronicle(year, n.name + " goes to war with " + foe.name + ".");
  return true;
}

function step() {
  year++;
  for (const n of nations) n.pops = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const id = owner[y][x];
    if (id >= 0) { const n = byId(id); if (n) n.pops++; }
  }
  nations = nations.filter(n => n.pops > 0 || n.born === year);
  const claimants = nations.slice();
  for (const n of claimants) {
    if (!nations.includes(n) || n.pops === 0) continue;
    measure(n);
    const tries = 1 + (n.pops > 36 ? 1 : 0);
    for (let t = 0; t < tries; t++) expand(n);
    settleWars(n);
    n.stability = Math.max(4, Math.min(100, n.stability));
    if (n.pops > 28 && n.reach > 11 && n.stability < 40 && (n.quietUntil || 0) <= year && rnd() < (42 - n.stability) / 140) rebel(n);
  }
  for (const n of nations) {
    if (!n.capital || owner[n.capital.y][n.capital.x] === n.id) continue;
    const cells = cellsOf(n.id);
    if (!cells.length) continue;
    let best = cells[0], bestD = Infinity;
    for (const [x, y] of cells) {
      const d = hypot(x, y, n.capital);
      if (d < bestD) { bestD = d; best = [x, y]; }
    }
    n.capital = { x: best[0], y: best[1] };
  }
  if (year % 40 === 0 && nations.length < 3 && rnd() < 0.8) seedWanderer();
  drawUI();
}

function measure(n) {
  const cells = cellsOf(n.id);
  n.pops = cells.length;
  if (!cells.length) { n.reach = 0; return; }
  if (owner[n.capital.y][n.capital.x] !== n.id) {
    let best = cells[0], bestD = Infinity;
    for (const [x, y] of cells) {
      const d = hypot(x, y, n.capital);
      if (d < bestD) { bestD = d; best = [x, y]; }
    }
    n.capital = { x: best[0], y: best[1] };
  }
  let maxD = 0, sum = 0;
  for (const [x, y] of cells) {
    const d = hypot(x, y, n.capital);
    if (d > maxD) maxD = d;
    sum += d;
  }
  n.reach = maxD;
  const avg = sum / cells.length;
  if (avg > 7) n.stability -= 0.35 + (avg - 7) * 0.12;
  else n.stability += 0.25;
}

function cellsOf(id) {
  const cells = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (owner[y][x] === id) cells.push([x, y]);
  return cells;
}

function movesFrom(n) {
  const empty = [], enemy = [];
  const seen = new Set();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (owner[y][x] !== n.id) continue;
    for (const [tx, ty] of neighbors(x, y)) {
      const key = ty * COLS + tx;
      if (seen.has(key) || grid[ty][tx] !== LAND || owner[ty][tx] === n.id) continue;
      seen.add(key);
      const move = { tx, ty, d: hypot(tx, ty, n.capital), o: owner[ty][tx] };
      if (move.o < 0) empty.push(move);
      else enemy.push(move);
    }
  }
  return { empty, enemy };
}

function pickClose(moves) {
  let maxD = 0;
  for (const m of moves) if (m.d > maxD) maxD = m.d;
  const weights = moves.map(m => (maxD - m.d) + maxD * 0.2 + 0.01);
  let total = 0;
  for (const w of weights) total += w;
  let r = rnd() * total;
  for (let i = 0; i < moves.length; i++) {
    r -= weights[i];
    if (r <= 0) return moves[i];
  }
  return moves[moves.length - 1];
}

function expand(n) {
  const { empty, enemy } = movesFrom(n);
  const near = empty.filter(m => m.d <= n.reach + 3.5);
  const pool = near.length ? near : empty;
  if (pool.length && (rnd() < 0.82 || !enemy.length)) {
    const m = pickClose(pool);
    owner[m.ty][m.tx] = n.id;
    n.stability = Math.min(100, n.stability + 0.4);
    return;
  }
  if (!enemy.length) return;
  const friendly = enemy.filter(m => !atPeace(n, m.o));
  if (!friendly.length) return;
  const m = pickClose(friendly);
  const foe = byId(m.o);
  if (!foe) { owner[m.ty][m.tx] = n.id; return; }
  if (foe.pops <= 4 && !atPeace(n, foe.id)) {
    owner[m.ty][m.tx] = n.id;
    if (foe.pops <= 1) chronicle(year, n.name + " absorbs " + foe.name + ".");
    return;
  }
  if (!n.atWar.has(foe.id)) {
    const border = enemy.filter(e => e.o === foe.id).length;
    if (border < 3 || rnd() > 0.35) return;
    declareWar(n, foe);
  }
  const power = n.pops + 4 + ri(6);
  const defense = foe.pops + ri(6);
  if (power > defense || m.d + 2 < hypot(m.tx, m.ty, foe.capital)) {
    owner[m.ty][m.tx] = n.id;
    foe.stability -= 3;
  } else {
    n.stability -= 1.5;
  }
}

function settleWars(n) {
  for (const id of [...n.atWar]) {
    const foe = byId(id);
    if (!foe || foe.pops === 0) { n.atWar.delete(id); delete n.wars[id]; continue; }
    const started = n.wars[id] || year;
    const border = movesFrom(n).enemy.filter(e => e.o === id).length;
    if (year - started > 10 + (n.id % 7) || border < 1) {
      makePeace(n, foe, 30 + ri(40));
      chronicle(year, n.name + " makes peace with " + foe.name + ".");
    }
  }
}

function rebel(n) {
  const cells = cellsOf(n.id);
  if (cells.length < 14) return;
  const far = cells.filter(([x, y]) => hypot(x, y, n.capital) >= Math.max(5, n.reach * 0.55));
  if (far.length < 5) return;
  let seed = far[0], sd = -1;
  for (const [x, y] of far) {
    const d = hypot(x, y, n.capital);
    if (d > sd) { sd = d; seed = [x, y]; }
  }
  const farSet = new Set(far.map(([x, y]) => y * COLS + x));
  const take = new Set([seed[1] * COLS + seed[0]]);
  const queue = [seed];
  const cap = Math.min(far.length, Math.max(5, Math.floor(cells.length * 0.38)));
  while (queue.length && take.size < cap) {
    const [cx, cy] = queue.shift();
    const next = neighbors(cx, cy).filter(([x, y]) => farSet.has(y * COLS + x) && !take.has(y * COLS + x));
    next.sort((a, b) => hypot(b[0], b[1], n.capital) - hypot(a[0], a[1], n.capital));
    for (const p of next) {
      if (take.size >= cap) break;
      take.add(p[1] * COLS + p[0]);
      queue.push(p);
    }
  }
  if (take.size < 5) return;
  let hx = seed[0], hy = seed[1], hd = -1;
  for (const k of take) {
    const x = k % COLS, y = Math.floor(k / COLS);
    const d = hypot(x, y, n.capital);
    if (d > hd) { hd = d; hx = x; hy = y; }
  }
  const baby = found(hx, hy, nameRealm(), colors[ri(colors.length)]);
  for (const k of take) owner[Math.floor(k / COLS)][k % COLS] = baby.id;
  baby.pops = take.size;
  baby.capital = { x: hx, y: hy };
  n.stability = Math.min(78, n.stability + 14);
  n.quietUntil = year + 70;
  makePeace(n, baby, 45 + ri(40));
  chronicle(year, baby.name + " breaks from " + n.name + ".");
}

function seedWanderer() {
  const empty = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[y][x] === LAND && owner[y][x] < 0) empty.push([x, y]);
  if (empty.length < 8) return;
  const [x, y] = empty[ri(empty.length)];
  found(x, y, nameRealm(), colors[ri(colors.length)]);
}

function render() {
  const cw = canvas.width / COLS, ch = canvas.height / ROWS;
  ctx.fillStyle = "#1a2744";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== LAND) continue;
      const id = owner[y][x];
      ctx.fillStyle = id < 0 ? "#6d8a52" : (byId(id)?.color || "#888");
      ctx.fillRect(x * cw, y * ch, Math.ceil(cw) + 0.5, Math.ceil(ch) + 0.5);
    }
  }
  ctx.strokeStyle = "rgba(20,16,12,0.45)";
  ctx.lineWidth = 1;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const id = owner[y][x];
      if (id < 0) continue;
      if (x < COLS - 1 && owner[y][x + 1] !== id && grid[y][x + 1] === LAND) {
        ctx.beginPath(); ctx.moveTo((x + 1) * cw, y * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch); ctx.stroke();
      }
      if (y < ROWS - 1 && owner[y + 1][x] !== id && grid[y + 1][x] === LAND) {
        ctx.beginPath(); ctx.moveTo(x * cw, (y + 1) * ch); ctx.lineTo((x + 1) * cw, (y + 1) * ch); ctx.stroke();
      }
    }
  }
  for (const n of nations) {
    if (!n.capital || owner[n.capital.y][n.capital.x] !== n.id) continue;
    const s = Math.max(2, Math.min(cw, ch) * 0.34);
    const cx = (n.capital.x + 0.5) * cw, cy = (n.capital.y + 0.5) * ch;
    ctx.fillStyle = "rgba(20,14,8,0.9)";
    ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
  }
}

function drawUI() {
  document.getElementById("year").textContent = "Year " + year + "  \u00b7  " + nations.length + " realms";
  const focus = byId(selected);
  document.getElementById("focus").textContent = focus ? focus.name : "The world";
  document.getElementById("stats").innerHTML = focus
    ? "Founded " + focus.born + "<br>Provinces " + focus.pops + "<br>Stability " + Math.round(focus.stability) + "<br>Reach " + Math.round(focus.reach || 0)
    : nations.length + " living realms";
  const list = document.getElementById("list");
  list.innerHTML = "";
  [...nations].sort((a, b) => b.pops - a.pops).slice(0, 14).forEach(n => {
    const li = document.createElement("li");
    li.innerHTML = '<i class="swatch" style="background:' + n.color + '"></i><span>' + n.name + '</span><span class="muted" style="margin-left:auto">' + n.pops + '</span>';
    li.onclick = () => { selected = n.id; drawUI(); };
    list.appendChild(li);
  });
  document.getElementById("log").innerHTML = logLines.map(l => "<div>" + l + "</div>").join("");
  document.getElementById("pause").textContent = paused ? "Resume" : "Pause";
}

canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * COLS);
  const y = Math.floor((e.clientY - r.top) / r.height * ROWS);
  if (grid && grid[y] && grid[y][x] === LAND && owner[y][x] >= 0) selected = owner[y][x];
  drawUI();
});
document.getElementById("newmap").onclick = generate;
document.getElementById("pause").onclick = () => { paused = !paused; drawUI(); };
document.getElementById("speed").onchange = () => {};

let last = 0;
function loop(t) {
  if (!last) last = t;
  const dt = t - last;
  last = t;
  if (!paused) {
    acc += dt * Number(document.getElementById("speed").value);
    while (acc > 280) { acc -= 280; step(); }
    render();
  }
  requestAnimationFrame(loop);
}
resize();
generate();
requestAnimationFrame(loop);
</script>
</body>
</html>
