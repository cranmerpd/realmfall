<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Realmfall is a browser world. Realms settle, trade grain, go hungry, fight, and sometimes break." />
<title>Realmfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/realmfall.css?v=0.22" />
</head>
<body>
<header>
  <div class="brand">
    <i class="pip"></i>
    <div>
      <h1>REALMFALL</h1>
      <p><button id="ver" class="quiet" type="button">v0.22 · notes</button></p>
    </div>
  </div>
  <div class="grow"></div>
  <div class="controls">
    <button id="newmap" type="button">New map</button>
    <button id="pause" type="button">Pause</button>
    <div class="seg" id="layer">
      <button type="button" data-m="politics" class="on">States</button>
      <button type="button" data-m="faith">Faith</button>
      <button type="button" data-m="goods">Goods</button>
    </div>
    <div class="seg" id="speed">
      <button type="button" data-s="1">1×</button>
      <button type="button" data-s="2" class="on">2×</button>
      <button type="button" data-s="4">4×</button>
      <button type="button" data-s="8">8×</button>
    </div>
  </div>
  <div class="clock">
    <span class="k" id="season">SPRING</span>
    <strong id="year">—</strong>
    <em id="count"></em>
  </div>
</header>
<div id="wrap">
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="tip"></div>
  </div>
  <aside>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="realm" class="on">Realm</button>
      <button type="button" data-tab="world">World</button>
      <button type="button" data-tab="faith">Faith</button>
      <button type="button" data-tab="log">Log</button>
    </div>
    <div id="panel"></div>
  </aside>
</div>
<script src="js/notes.js?v=0.22"></script>
<script src="js/state.js?v=0.22"></script>
<script src="js/world.js?v=0.22"></script>
<script src="js/sim.js?v=0.22"></script>
<script src="js/view.js?v=0.22"></script>
</body>
</html>
